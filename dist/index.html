<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>Halo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0c;--surface:#111116;--surface2:#16161e;--border:#1e1e2a;
  --primary:#00ff9f;--primary-dim:rgba(0,255,159,0.12);--primary-dark:rgba(0,255,159,0.06);
  --text:#e8e8f0;--muted:#6b6b80;--danger:#ff4d6d;--warn:#ffb347;
  --radius:10px;--radius-sm:6px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.logo{padding:18px 14px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo-mark{width:34px;height:34px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:18px;flex-shrink:0}
.logo-name{font-weight:700;font-size:15px;letter-spacing:-.3px}
.logo-tag{font-size:10px;color:var(--muted);margin-top:1px}
nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .15s;margin-bottom:1px;user-select:none}
.nav-item:hover{background:var(--border);color:var(--text)}
.nav-item.active{background:var(--primary-dim);color:var(--primary)}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.badge{margin-left:auto;background:var(--primary);color:#000;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;display:none}
.badge.show{display:block}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:17px;font-weight:700}
.page-content{flex:1;overflow-y:auto;padding:20px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{opacity:.85}.btn:active{opacity:.7}
.btn-primary{background:var(--primary);color:#000}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:rgba(255,179,71,.15);color:var(--warn);border:1px solid rgba(255,179,71,.3)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:5px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-weight:600;font-size:15px;margin-bottom:12px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat-label{color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:26px;font-weight:800}
.stat-value.g{color:var(--primary)}.stat-value.y{color:var(--warn)}.stat-value.r{color:var(--danger)}

/* PILLS */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.running{background:rgba(0,255,159,.15);color:var(--primary)}
.pill.pending{background:rgba(107,107,128,.2);color:var(--muted)}
.pill.waiting_for_approval{background:rgba(255,179,71,.15);color:var(--warn)}
.pill.completed{background:rgba(0,255,159,.1);color:#00cc7a}
.pill.failed{background:rgba(255,77,109,.15);color:var(--danger)}

/* TASK LIST */
.task-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s}
.task-row:last-child{border-bottom:none}
.task-row:hover{opacity:.8}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task-dot.running{background:var(--primary);box-shadow:0 0 6px var(--primary);animation:pulse 1.5s infinite}
.task-dot.completed{background:#00cc7a}
.task-dot.failed{background:var(--danger)}
.task-dot.waiting_for_approval{background:var(--warn)}
.task-dot.pending{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.task-info{flex:1;min-width:0}
.task-goal{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.task-meta{font-size:12px;color:var(--muted)}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{display:block;margin-bottom:5px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:90px}
select.form-input{cursor:pointer}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s;user-select:none}
.chip.on{border-color:var(--primary);background:var(--primary-dim);color:var(--primary)}
.filter-chip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap}
.filter-chip.on{border-color:var(--primary);background:var(--primary-dim);color:var(--primary)}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-info .label{font-weight:500;margin-bottom:1px}
.toggle-info .desc{font-size:12px;color:var(--muted)}
.tog{position:relative;width:42px;height:23px;flex-shrink:0;cursor:pointer}
.tog input{display:none}
.tog-track{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:background .2s}
.tog input:checked~.tog-track{background:var(--primary)}
.tog-thumb{position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
.tog input:checked~.tog-thumb{transform:translateX(19px)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

/* STEPS / TIMELINE */
.step-timeline{display:flex;flex-direction:column;gap:0}
.step-item{display:flex;gap:10px;padding:6px 0}
.step-line{display:flex;flex-direction:column;align-items:center;width:16px;flex-shrink:0}
.step-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.step-connector{width:2px;flex:1;background:var(--border);margin:3px 0;min-height:12px}
.step-body{flex:1;min-width:0;padding-bottom:4px}
.step-type{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.step-content{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:12px;word-break:break-word;max-height:200px;overflow-y:auto}
.step-content.thought{border-color:rgba(0,255,159,.2);background:var(--primary-dark)}
.step-content.error{border-color:rgba(255,77,109,.2);background:rgba(255,77,109,.04)}
.step-content.result{border-color:rgba(0,204,122,.3);background:rgba(0,204,122,.05);font-weight:500}

/* APPROVAL BANNER */
.approval-banner{background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.3);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.approval-title{color:var(--warn);font-weight:600;margin-bottom:6px}
.approval-code{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;font-family:monospace;font-size:12px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-all}

/* LOG */
.log-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-family:monospace;font-size:12px}
.log-time{color:var(--muted);flex-shrink:0}
.log-lvl{width:38px;flex-shrink:0;font-weight:700}
.log-lvl.error{color:var(--danger)}.log-lvl.warn{color:var(--warn)}.log-lvl.info{color:var(--primary)}

/* EMPTY STATE */
.empty{text-align:center;padding:50px 0;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* SPINNER */
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;max-width:300px}
#toast.show{opacity:1}
/* CHARACTERS & CHAT */
.char-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.char-row:last-child{border-bottom:none}
.char-av{width:40px;height:40px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.char-av.big{width:64px;height:64px;font-size:24px}
.char-av img{width:100%;height:100%;object-fit:cover}
.char-info{flex:1;min-width:0;cursor:pointer}
.char-info .label{font-weight:600}
.char-info .desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 100px);max-width:760px;margin:0 auto}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.bubble{max-width:85%;padding:10px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--border);word-wrap:break-word;align-self:flex-start}
.bubble.user{align-self:flex-end;background:var(--primary-dim);border-color:rgba(0,255,159,.25)}
.bubble .who{font-size:11px;color:var(--primary);margin-bottom:3px;font-weight:600}
.bubble em{color:#a9a9bd}
.bubble-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--border)}
.chat-input textarea{min-height:42px;max-height:140px;resize:none}
.dev-pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;font-family:monospace}
.menu-btn{display:none}
/* GLASSES MODE (RayNeo X3 Pro): black is transparent on the waveguide */
body.glasses{--bg:#000;--surface:#000;--surface2:#000;--border:#16303a;font-size:var(--glasses-fs,20px)}
body.glasses .sidebar{display:none}
body.glasses.menu-open .sidebar{display:flex;position:fixed;inset:0;width:100%;z-index:300}
body.glasses .menu-btn{display:inline-flex}
body.glasses .form-input,body.glasses .btn,body.glasses .nav-item{font-size:inherit}
body.glasses .page-content{padding:10px}
body.glasses .topbar{padding:8px 10px}
body.glasses .bubble{max-width:100%}
body.glasses .chat-wrap{height:calc(100vh - 70px)}
body.kbd :focus,body.devmode :focus{outline:3px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">N</div>
      <div><div class="logo-name">Halo</div><div class="logo-tag">AI Automation</div></div>
    </div>
    <nav>
      <div class="nav-group">Main</div>
      <div class="nav-item active" data-page="home"><span class="ico">⌂</span> Dashboard</div>
      <div class="nav-item" data-page="tasks"><span class="ico">⚡</span> Tasks <span class="badge" id="badge-running">0</span></div>
      <div class="nav-item" data-page="new-task"><span class="ico">＋</span> New Task</div>
      <div class="nav-item" data-page="characters"><span class="ico">♡</span> Characters</div>
      <div class="nav-item" data-page="memory"><span class="ico">◈</span> Memory</div>
      <div class="nav-item" data-page="skills"><span class="ico">✦</span> Skills</div>
      <div class="nav-group">Config</div>
      <div class="nav-item" data-page="providers"><span class="ico">◎</span> Providers</div>
      <div class="nav-item" data-page="permissions"><span class="ico">🛡</span> Permissions</div>
      <div class="nav-item" data-page="logs"><span class="ico">☰</span> Logs</div>
      <div class="nav-item" data-page="glasses"><span class="ico">◐</span> Glasses &amp; Dev</div>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left"><button class="btn btn-ghost btn-sm menu-btn" onclick="document.body.classList.toggle('menu-open')" aria-label="Menu">☰</button><div class="topbar-title" id="page-title">Dashboard</div></div>
      <div id="topbar-action"></div>
    </div>
    <div class="page-content" id="content"></div>
  </main>
</div>

<!-- TASK DETAIL MODAL -->
<div class="overlay" id="task-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Task</div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';
// ────────────────────────────────────────────────────────────────────────────
// STATE — all persisted in localStorage
// ────────────────────────────────────────────────────────────────────────────
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const DB = {
  tasks: () => LS.get('halo_tasks', []),
  saveTasks: (t) => LS.set('halo_tasks', t),
  task: (id) => DB.tasks().find(t => t.id === id),
  createTask: (t) => {
    const tasks = DB.tasks();
    tasks.unshift(t);
    DB.saveTasks(tasks.slice(0, 200));
    return t;
  },
  updateTask: (id, patch) => {
    const tasks = DB.tasks();
    const i = tasks.findIndex(t => t.id === id);
    if (i !== -1) { tasks[i] = { ...tasks[i], ...patch }; DB.saveTasks(tasks); return tasks[i]; }
    return null;
  },
  addStep: (taskId, step) => {
    const tasks = DB.tasks();
    const i = tasks.findIndex(t => t.id === taskId);
    if (i !== -1) {
      tasks[i].steps = tasks[i].steps || [];
      tasks[i].steps.push({ ...step, id: uid(), ts: Date.now() });
      DB.saveTasks(tasks);
    }
  },
  memory: () => LS.get('halo_memory', []),
  addMemory: (entry) => {
    const mem = DB.memory();
    mem.unshift(entry);
    LS.set('halo_memory', mem.slice(0, 500));
  },
  delMemory: (id) => LS.set('halo_memory', DB.memory().filter(m => m.id !== id)),
  settings: () => LS.get('halo_settings', {}),
  saveSettings: (s) => LS.set('halo_settings', s),
  logs: () => LS.get('halo_logs', []),
  addLog: (level, msg) => {
    const logs = DB.logs();
    logs.unshift({ id: uid(), level, message: msg, ts: Date.now() });
    LS.set('halo_logs', logs.slice(0, 300));
  },
  perms: () => LS.get('halo_perms', {
    allow_web_access: true, allow_file_read: false, allow_github_read: true,
    allow_github_write: false, allow_memory_write: true, require_approval: true
  }),
  savePerms: (p) => LS.set('halo_perms', p),
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const timeAgo = (ts) => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
};

// ────────────────────────────────────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, color = 'var(--primary)') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = color;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ────────────────────────────────────────────────────────────────────────────
// LLM ROUTER
// ────────────────────────────────────────────────────────────────────────────
const PROVIDERS = {
  openai:    { label:'OpenAI GPT', keyField:'openaiKey', keyHint:'sk-…', modelField:'openaiModel',
               models:['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'] },
  anthropic: { label:'Anthropic Claude', keyField:'anthropicKey', keyHint:'sk-ant-…', modelField:'anthropicModel',
               models:['claude-opus-5-5','claude-sonnet-5-5','claude-haiku-5-5','claude-opus-4-8','claude-sonnet-4-6'] },
  google:    { label:'Google Gemini', keyField:'googleKey', keyHint:'AIza…', modelField:'googleModel',
               models:['gemini-2.0-flash','gemini-1.5-pro','gemini-1.5-flash'] },
  venice:    { label:'Venice AI (private)', keyField:'veniceKey', keyHint:'Venice API key', modelField:'veniceModel',
               models:['venice-uncensored','llama-3.3-70b','qwen3-235b','mistral-31-24b','llama-3.2-3b'],
               note:'Private, no-log inference via api.venice.ai. Model list is editable — type any Venice model id.' },
  spicy:     { label:'SpicyAPI', keyField:'spicyKey', keyHint:'sk-spicy-…', modelField:'spicyModel',
               urlField:'spicyUrl', urlHint:'https://…/v1', urlRequired:true, models:[],
               note:'OpenAI-compatible. Paste the API base URL and model id from your SpicyAPI dashboard.' },
  local:     { label:'Local LLM (on-device / LAN)', keyField:'localKey', keyHint:'optional', modelField:'localModel',
               urlField:'localUrl', urlHint:'http://127.0.0.1:11434/v1', keyOptional:true,
               models:['qwen3:8b','qwen3:14b','qwen3:30b-a3b','gemma3:12b','llama3.1:8b','dolphin3:8b','llama3.2'],
               note:'Any OpenAI-compatible server: Ollama (Termux or PC), LM Studio, llama.cpp server. Nothing leaves your network. For Ollama set OLLAMA_ORIGINS=* so the app can reach it.' },
};
function providerReady(id, s = DB.settings()) {
  const p = PROVIDERS[id];
  if (!p) return false;
  if (p.urlRequired) return !!(s[p.urlField] && s[p.keyField] && s[p.modelField]);
  if (p.urlField) return !!(s[p.urlField] || p.urlHint);
  return !!s[p.keyField];
}
function extractJson(text) {
  const m = text.match(/```json\s*([\s\S]*?)\s*```/) || text.match(/(\{[\s\S]*\})/);
  return JSON.parse(m ? m[1] : text);
}
async function callOpenAICompat(label, baseUrl, key, model, messages, expectJson, extra = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers['Authorization'] = `Bearer ${key}`;
  const r = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
    method: 'POST', headers,
    body: JSON.stringify({ model, messages, stream: false, ...extra })
  });
  if (!r.ok) throw new Error(`${label} ${r.status}: ${await r.text()}`);
  const d = await r.json();
  const text = d.choices[0].message.content;
  return expectJson ? extractJson(text) : text;
}

async function callLLM(messages, expectJson = true) {
  const s = DB.settings();
  const provider = s.defaultProvider || 'local';

  if (provider === 'venice') {
    if (!s.veniceKey) throw new Error('No Venice API key. Add it in Providers.');
    return callOpenAICompat('Venice', 'https://api.venice.ai/api/v1', s.veniceKey,
      s.veniceModel || 'venice-uncensored', messages, expectJson,
      { venice_parameters: { include_venice_system_prompt: false } });
  }

  if (provider === 'spicy') {
    if (!s.spicyKey || !s.spicyUrl || !s.spicyModel) throw new Error('SpicyAPI needs a base URL, key and model. Add them in Providers.');
    return callOpenAICompat('SpicyAPI', s.spicyUrl, s.spicyKey, s.spicyModel, messages, expectJson);
  }

  if (provider === 'local') {
    const base = s.localUrl || PROVIDERS.local.urlHint;
    try {
      return await callOpenAICompat('Local LLM', base, s.localKey, s.localModel || 'llama3.2', messages, expectJson);
    } catch (e) {
      if (e instanceof TypeError) throw new Error(`Cannot reach local LLM at ${base}. Is the server running and CORS allowed (OLLAMA_ORIGINS=*)?`);
      throw e;
    }
  }

  if (provider === 'openai') {
    if (!s.openaiKey) throw new Error('No OpenAI key. Add it in Providers.');
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${s.openaiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: s.openaiModel || 'gpt-4o',
        messages,
        ...(expectJson ? { response_format: { type: 'json_object' } } : {})
      })
    });
    if (!r.ok) throw new Error(`OpenAI ${r.status}: ${await r.text()}`);
    const d = await r.json();
    const text = d.choices[0].message.content;
    return expectJson ? JSON.parse(text) : text;
  }

  if (provider === 'anthropic') {
    if (!s.anthropicKey) throw new Error('No Anthropic key. Add it in Providers.');
    const sys = messages.find(m => m.role === 'system');
    const msgs = messages.filter(m => m.role !== 'system');
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': s.anthropicKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: s.anthropicModel || 'claude-sonnet-5-5',
        max_tokens: 4096,
        ...(sys ? { system: sys.content } : {}),
        messages: msgs
      })
    });
    if (!r.ok) throw new Error(`Anthropic ${r.status}: ${await r.text()}`);
    const d = await r.json();
    const text = d.content[0].text;
    if (!expectJson) return text;
    return extractJson(text);
  }

  if (provider === 'google') {
    if (!s.googleKey) throw new Error('No Google API key. Add it in Providers.');
    const model = s.googleModel || 'gemini-1.5-pro';
    const sys = messages.find(m => m.role === 'system');
    const msgs = messages.filter(m => m.role !== 'system');
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${s.googleKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...(sys ? { system_instruction: { parts: [{ text: sys.content }] } } : {}),
        contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
        generationConfig: expectJson ? { responseMimeType: 'application/json' } : {}
      })
    });
    if (!r.ok) throw new Error(`Google ${r.status}: ${await r.text()}`);
    const d = await r.json();
    const text = d.candidates[0].content.parts[0].text;
    return expectJson ? JSON.parse(text) : text;
  }

  throw new Error(`Unknown provider: ${provider}`);
}

// ────────────────────────────────────────────────────────────────────────────
// SKILLS — a "master skill" that indexes SKILL.md folders in GitHub repos and
// loads a skill's full instructions only when the agent asks for it.
// ────────────────────────────────────────────────────────────────────────────
const SKILLS = {
  DEFAULT_SOURCES: ['anthropics/skills'],
  sources() {
    const s = DB.settings();
    return Array.isArray(s.skillSources) ? s.skillSources : this.DEFAULT_SOURCES;
  },
  index() { try { return JSON.parse(localStorage.getItem('halo_skill_index') || '{"skills":[]}'); } catch { return { skills: [] }; } },
  saveIndex(ix) { try { localStorage.setItem('halo_skill_index', JSON.stringify(ix)); } catch {} },
  parseSource(src) {
    const m = String(src).trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').match(/^([\w.-]+)\/([\w.-]+)(?:@([\w./-]+))?$/);
    if (!m) throw new Error(`Bad skill source "${src}". Use owner/repo or owner/repo@branch.`);
    return { owner: m[1], repo: m[2], ref: m[3] || 'HEAD' };
  },
  ghHeaders() {
    const t = DB.settings().githubToken;
    return t ? { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json' } : { 'Accept': 'application/vnd.github.v3+json' };
  },
  raw(owner, repo, ref, path) {
    return `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path.split('/').map(encodeURIComponent).join('/')}`;
  },
  frontmatter(text) {
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    const meta = {};
    if (m) {
      const lines = m[1].split('\n');
      for (let i = 0; i < lines.length; i++) {
        const kv = lines[i].match(/^([A-Za-z_-]+):\s*(.*)$/);
        if (!kv) continue;
        let val = kv[2].trim();
        if (/^[>|][+-]?$/.test(val)) {
          const block = [];
          while (i + 1 < lines.length && (/^\s+\S/.test(lines[i + 1]) || lines[i + 1].trim() === '')) block.push(lines[++i].trim());
          val = block.join(val[0] === '>' ? ' ' : '\n').trim();
        }
        meta[kv[1]] = val.replace(/^["']|["']$/g, '').trim();
      }
    }
    return { meta, body: m ? text.slice(m[0].length) : text };
  },
  async refresh(onProgress = () => {}) {
    const skills = [], errors = [];
    for (const src of this.sources()) {
      try {
        const { owner, repo, ref } = this.parseSource(src);
        onProgress(`Indexing ${owner}/${repo}…`);
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${ref}?recursive=1`, { headers: this.ghHeaders() });
        if (!r.ok) throw new Error(`GitHub ${r.status}${r.status === 403 ? ' (rate limit: add a GitHub token in Providers)' : ''}`);
        const tree = (await r.json()).tree || [];
        const files = tree.filter(t => t.type === 'blob').map(t => t.path);
        const skillFiles = files.filter(f => /(^|\/)SKILL\.md$/.test(f) && !/(^|\/)template\//.test(f));
        await Promise.all(skillFiles.map(async path => {
          const dir = path.replace(/\/?SKILL\.md$/, '');
          const t = await (await fetch(this.raw(owner, repo, ref, path))).text();
          const { meta } = this.frontmatter(t);
          skills.push({
            name: meta.name || dir.split('/').pop() || repo,
            description: (meta.description || '').slice(0, 400),
            source: `${owner}/${repo}`, ref, path, dir,
            files: files.filter(f => dir ? f.startsWith(dir + '/') : !f.includes('/')).map(f => dir ? f.slice(dir.length + 1) : f).filter(f => f !== 'SKILL.md').slice(0, 60)
          });
        }));
      } catch (e) { errors.push(`${src}: ${e.message}`); }
    }
    skills.sort((a, b) => a.name.localeCompare(b.name));
    const ix = { skills, errors, updatedAt: Date.now() };
    this.saveIndex(ix);
    DB.addLog(errors.length ? 'warn' : 'info', `Skills indexed: ${skills.length}${errors.length ? ` (errors: ${errors.join('; ')})` : ''}`);
    return ix;
  },
  async ensure() {
    const ix = this.index();
    if (ix.skills.length && Date.now() - (ix.updatedAt || 0) < 24 * 3600e3) return ix;
    try { return await this.refresh(); } catch { return ix; }
  },
  find(name) {
    const n = String(name || '').toLowerCase().trim();
    const all = this.index().skills;
    return all.find(s => s.name.toLowerCase() === n) || all.find(s => `${s.source}/${s.dir}`.toLowerCase() === n) || all.find(s => s.name.toLowerCase().includes(n));
  },
  catalog(max = 40) {
    return this.index().skills.slice(0, max).map(s => `- ${s.name}: ${s.description.slice(0, 160)}`).join('\n');
  }
};

const ARKON = {
  token: null,
  cfg() {
    const s = DB.settings();
    return { url: (s.arkonUrl || '').replace(/\/+$/, ''), email: s.arkonEmail || '', password: s.arkonPassword || '' };
  },
  async login() {
    const c = this.cfg();
    if (!c.url || !c.email || !c.password) throw new Error('Arkon is not set up. Add its URL, email and password in Providers.');
    const r = await fetch(`${c.url}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: c.email, password: c.password })
    });
    if (!r.ok) throw new Error(`Arkon login failed (${r.status})`);
    this.token = (await r.json()).access_token;
    return this.token;
  },
  async get(path) {
    const c = this.cfg();
    for (let attempt = 0; attempt < 2; attempt++) {
      if (!this.token) await this.login();
      let r;
      try { r = await fetch(`${c.url}${path}`, { headers: { 'Authorization': `Bearer ${this.token}` } }); }
      catch (e) { throw new Error(`Cannot reach Arkon at ${c.url}. Is it running?`); }
      if (r.status === 401 && attempt === 0) { this.token = null; continue; }
      if (!r.ok) throw new Error(`Arkon ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return r.json();
    }
  }
};

const TOOLS = {
  arkon_search: {
    desc: 'Search the Arkon knowledge wiki (titles and summaries). Args: {"query": "keywords"}',
    risky: false,
    async run({ query = '' } = {}) {
      const pages = await ARKON.get('/api/wiki/pages?limit=500');
      const words = String(query).toLowerCase().split(/\s+/).filter(Boolean);
      const scored = pages.map(p => {
        const hay = `${p.title} ${p.summary} ${p.slug} ${(p.knowledge_type_slugs || []).join(' ')}`.toLowerCase();
        return { p, score: words.reduce((n, w) => n + (hay.includes(w) ? 1 : 0), 0) };
      }).filter(x => !words.length || x.score > 0).sort((a, b) => b.score - a.score);
      return {
        results: scored.slice(0, 10).map(({ p }) => ({ slug: p.slug, title: p.title, summary: p.summary, scope: p.scope_name || p.scope_type })),
        total_pages: pages.length,
        note: 'Use arkon_read with a slug to read a page.'
      };
    }
  },
  arkon_read: {
    desc: 'Read one Arkon wiki page in full. Args: {"slug": "page-slug"}',
    risky: false,
    async run({ slug }) {
      const d = await ARKON.get(`/api/wiki/pages/${String(slug).split('/').map(encodeURIComponent).join('/')}`);
      return { slug: d.slug, title: d.title, content: (d.content_md || '').slice(0, 12000), truncated: (d.content_md || '').length > 12000, links: d.outlinks };
    }
  },
  skill_list: {
    desc: 'List available skills from GitHub skill libraries. Args: {"query": "optional keyword"}',
    risky: false,
    async run({ query = '' } = {}) {
      await SKILLS.ensure();
      const q = String(query).toLowerCase();
      const hits = SKILLS.index().skills.filter(s => !q || `${s.name} ${s.description}`.toLowerCase().includes(q));
      return { skills: hits.slice(0, 25).map(s => ({ name: s.name, description: s.description, source: s.source })), total: hits.length };
    }
  },
  skill_load: {
    desc: 'Load a skill\'s full instructions (SKILL.md) before doing a task it covers. Args: {"name": "skill name"}',
    risky: false,
    async run({ name }) {
      await SKILLS.ensure();
      const sk = SKILLS.find(name);
      if (!sk) return { error: `No skill named "${name}". Call skill_list to see what exists.` };
      const [owner, repo] = sk.source.split('/');
      const text = await (await fetch(SKILLS.raw(owner, repo, sk.ref, sk.path))).text();
      const { body } = SKILLS.frontmatter(text);
      const LIMIT = 12000;
      return {
        name: sk.name, source: sk.source,
        instructions: body.length > LIMIT ? body.slice(0, LIMIT) + `\n\n[…truncated ${body.length - LIMIT} chars]` : body,
        files: sk.files,
        note: sk.files.length ? 'Use skill_read_file to open any listed file the instructions refer to.' : undefined
      };
    }
  },
  skill_read_file: {
    desc: 'Read a supporting file inside a skill folder. Args: {"name": "skill name", "file": "relative/path"}',
    risky: false,
    async run({ name, file }) {
      await SKILLS.ensure();
      const sk = SKILLS.find(name);
      if (!sk) return { error: `No skill named "${name}".` };
      const rel = String(file || '').replace(/^\/+/, '');
      if (!sk.files.includes(rel)) return { error: `"${rel}" is not in ${sk.name}. Files: ${sk.files.join(', ')}` };
      const [owner, repo] = sk.source.split('/');
      const text = await (await fetch(SKILLS.raw(owner, repo, sk.ref, sk.dir ? `${sk.dir}/${rel}` : rel))).text();
      return { file: rel, content: text.slice(0, 12000), truncated: text.length > 12000 };
    }
  },
  web_fetch: {
    desc: 'Fetch content from a URL',
    risky: false,
    async run({ url }) {
      try {
        const r = await fetch(url);
        const text = await r.text();
        const clean = text.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        return { success: true, content: clean.slice(0, 6000), url, status: r.status };
      } catch(e) { return { success: false, error: e.message, url }; }
    }
  },
  github_read: {
    desc: 'Read a file from a GitHub repository',
    risky: false,
    async run({ owner, repo, path }) {
      const s = DB.settings();
      if (!s.githubToken) throw new Error('No GitHub token. Add it in Providers.');
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`, {
        headers: { 'Authorization': `token ${s.githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message}`);
      const d = await r.json();
      return { content: atob(d.content.replace(/\n/g,'')), sha: d.sha, path };
    }
  },
  github_list: {
    desc: 'List files in a GitHub repo directory',
    risky: false,
    async run({ owner, repo, path = '' }) {
      const s = DB.settings();
      if (!s.githubToken) throw new Error('No GitHub token. Add it in Providers.');
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        headers: { 'Authorization': `token ${s.githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!r.ok) throw new Error(`GitHub ${r.status}`);
      const d = await r.json();
      return { files: (Array.isArray(d) ? d : [d]).map(f => ({ name: f.name, path: f.path, type: f.type, size: f.size })) };
    }
  },
  github_write: {
    desc: 'Create or update a file in a GitHub repository',
    risky: true,
    async run({ owner, repo, path, content, message }) {
      const s = DB.settings();
      if (!s.githubToken) throw new Error('No GitHub token. Add it in Providers.');
      let sha;
      try { const ex = await TOOLS.github_read.run({ owner, repo, path }); sha = ex.sha; } catch {}
      const body = { message: message || `Update ${path}`, content: btoa(unescape(encodeURIComponent(content))) };
      if (sha) body.sha = sha;
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${s.githubToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error(`GitHub write ${r.status}: ${(await r.json()).message}`);
      return { success: true, path, message };
    }
  },
  memory_search: {
    desc: 'Search stored memory for relevant information',
    risky: false,
    async run({ query }) {
      const mem = DB.memory();
      const q = query.toLowerCase();
      const results = mem.filter(m => m.content.toLowerCase().includes(q));
      return { results: results.slice(0, 5), total: mem.length };
    }
  },
  memory_write: {
    desc: 'Store information in long-term memory',
    risky: false,
    async run({ content, type = 'long_term' }) {
      const entry = { id: uid(), content, memoryType: type, createdAt: Date.now() };
      DB.addMemory(entry);
      return { success: true, id: entry.id };
    }
  }
};

// ────────────────────────────────────────────────────────────────────────────
// AGENT LOOP
// ────────────────────────────────────────────────────────────────────────────
const SYSTEM = `You are Halo, an AI agent that uses tools to complete tasks.

Respond ONLY with valid JSON in this exact format:
{
  "status": "continue" | "done",
  "thought": "brief reasoning about what to do next",
  "action": "tool_name or null if done",
  "args": {} or null,
  "summary": "final answer/result if status is done"
}

Be efficient — use tools purposefully and complete tasks in 5-8 steps maximum.`;

const activeTasks = {};

async function runAgent(taskId) {
  if (activeTasks[taskId]) return;
  activeTasks[taskId] = true;

  const task = DB.task(taskId);
  if (!task) { delete activeTasks[taskId]; return; }

  DB.updateTask(taskId, { status: 'running', startedAt: Date.now() });
  DB.addLog('info', `Task started: ${task.goal}`);

  const allowedTools = (task.allowedTools || ['web_fetch', 'memory_search', 'memory_write'])
    .filter(t => TOOLS[t]);

  const toolList = allowedTools.map(t => `- ${t}: ${TOOLS[t].desc}`).join('\n');

  let skillNote = '';
  if (allowedTools.includes('skill_load')) {
    await SKILLS.ensure();
    const cat = SKILLS.catalog();
    if (cat) skillNote = `\n\nSkills you can load with skill_load when the task matches one (load before acting, only when relevant):\n${cat}`;
  }

  const messages = [
    { role: 'system', content: SYSTEM },
    { role: 'user', content: `Task: ${task.goal}\n\nAvailable tools:\n${toolList}${skillNote}\n\nBegin.` }
  ];

  DB.addStep(taskId, { stepType: 'start', content: task.goal });

  let steps = 0;
  const MAX = 12;

  try {
    while (steps < MAX && activeTasks[taskId]) {
      steps++;

      let resp;
      try {
        resp = await callLLM(messages);
      } catch(e) {
        DB.addLog('error', `LLM error: ${e.message}`);
        DB.addStep(taskId, { stepType: 'error', content: `LLM error: ${e.message}` });
        DB.updateTask(taskId, { status: 'failed', error: e.message });
        delete activeTasks[taskId];
        return;
      }

      if (resp.thought) {
        DB.addStep(taskId, { stepType: 'thought', content: resp.thought });
      }

      if (resp.status === 'done' || !resp.action) {
        DB.addStep(taskId, { stepType: 'result', content: resp.summary || 'Task completed.' });
        DB.updateTask(taskId, { status: 'completed', completedAt: Date.now() });
        DB.addLog('info', `Task completed: ${task.goal}`);
        delete activeTasks[taskId];
        refreshBadge();
        return;
      }

      const toolName = resp.action;
      const toolArgs = resp.args || {};

      if (!TOOLS[toolName] || !allowedTools.includes(toolName)) {
        messages.push({ role: 'assistant', content: JSON.stringify(resp) });
        messages.push({ role: 'user', content: JSON.stringify({ error: `Tool "${toolName}" not available. Use: ${allowedTools.join(', ')}` }) });
        continue;
      }

      // Approval check
      if (task.requireApproval && TOOLS[toolName].risky) {
        DB.updateTask(taskId, {
          status: 'waiting_for_approval',
          pendingApproval: { toolName, toolArgs, stepIdx: steps }
        });
        DB.addStep(taskId, { stepType: 'approval_request', content: `${toolName}(${JSON.stringify(toolArgs)})` });
        DB.addLog('warn', `Approval needed: ${toolName}`);
        delete activeTasks[taskId];
        refreshBadge();

        // Wait for approval in a new promise
        await new Promise(resolve => {
          const timer = setInterval(() => {
            const t = DB.task(taskId);
            if (!t || t.status !== 'waiting_for_approval') {
              clearInterval(timer);
              resolve();
            }
          }, 800);
        });

        const updated = DB.task(taskId);
        if (!updated || updated.approvalResult === false || updated.status === 'failed') {
          if (updated?.approvalResult === false) {
            DB.addStep(taskId, { stepType: 'rejected', content: `Rejected: ${toolName}` });
            DB.updateTask(taskId, { status: 'failed', error: 'Action rejected by user' });
          }
          delete activeTasks[taskId];
          return;
        }

        activeTasks[taskId] = true;
        DB.updateTask(taskId, { status: 'running', pendingApproval: null, approvalResult: null });
      }

      // Execute tool
      DB.addStep(taskId, { stepType: 'tool_call', content: `${toolName}(${JSON.stringify(toolArgs)})` });
      DB.addLog('info', `Tool: ${toolName}`);

      let result;
      try {
        result = await TOOLS[toolName].run(toolArgs);
      } catch(e) {
        result = { error: e.message };
        DB.addLog('error', `Tool error ${toolName}: ${e.message}`);
      }

      const resultStr = JSON.stringify(result);
      DB.addStep(taskId, { stepType: 'tool_result', content: resultStr.slice(0, 2000) });

      messages.push({ role: 'assistant', content: JSON.stringify(resp) });
      messages.push({ role: 'user', content: `Result of ${toolName}: ${resultStr.slice(0, 3000)}\n\nContinue. Use the same JSON format.` });
    }

    // Max steps
    DB.addStep(taskId, { stepType: 'result', content: 'Reached step limit. Task marked complete.' });
    DB.updateTask(taskId, { status: 'completed', completedAt: Date.now() });
  } catch(e) {
    DB.addLog('error', `Agent error: ${e.message}`);
    DB.updateTask(taskId, { status: 'failed', error: e.message });
  }

  delete activeTasks[taskId];
  refreshBadge();
}

function resumeTask(taskId, approved) {
  DB.updateTask(taskId, { approvalResult: approved, status: approved ? 'running' : 'failed' });
  if (approved) runAgent(taskId);
}

const PAGE_TITLES = {
  home: 'Dashboard', tasks: 'Tasks', 'new-task': 'New Task',
  memory: 'Memory', skills: 'Skills', characters: 'Characters', chat: 'Chat', glasses: 'Glasses & Dev', providers: 'Providers', permissions: 'Permissions', logs: 'Logs'
};

let currentPage = 'home';
let pollTimer = null;

function navigate(page) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  currentPage = page;
  document.body.classList.remove('menu-open');
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  document.getElementById('topbar-action').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  PAGES[page]?.();
}

document.querySelectorAll('.nav-item[data-page]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

function refreshBadge() {
  const running = DB.tasks().filter(t => t.status === 'running' || t.status === 'waiting_for_approval').length;
  const badge = document.getElementById('badge-running');
  badge.textContent = running;
  badge.classList.toggle('show', running > 0);
}

// ────────────────────────────────────────────────────────────────────────────
// SHARED UI
// ────────────────────────────────────────────────────────────────────────────
function pill(status) {
  return `<span class="pill ${status}">${status.replace(/_/g,' ')}</span>`;
}
function taskDot(status) {
  return `<div class="task-dot ${status}"></div>`;
}
function filterChips(items, active, onSelect) {
  return `<div class="filter-row">${items.map(i =>
    `<div class="filter-chip ${i===active?'on':''}" onclick="(${onSelect})('${i}')">${i.replace(/_/g,' ')}</div>`
  ).join('')}</div>`;
}

      .filter(([id]) => providerReady(id, s))
      .map(([id, p]) => ({ id, label: p.label, model: s[p.modelField] || p.models[0] || '' }));

    c.innerHTML = `
      <div class="card" style="max-width:600px">
        <div class="card-title">New Agent Task</div>
        <div class="form-group">
          <label class="form-label">Goal</label>
          <textarea class="form-input" id="ni-goal" placeholder="What should the agent accomplish?" rows="4"></textarea>
        </div>
        ${providers.length > 0 ? `
        <div class="form-group">
          <label class="form-label">Provider</label>
          <select class="form-input" id="ni-provider">
            ${providers.map(p => `<option value="${p.id}" ${(s.defaultProvider||'local')===p.id?'selected':''}>${p.label} (${p.model})</option>`).join('')}

        </div>` : `<div class="card" style="border-color:rgba(255,179,71,.3);background:rgba(255,179,71,.05);margin-bottom:14px">

          <div style="font-size:13px;color:var(--muted)">Add an API key in <a href="#" onclick="navigate('providers')" style="color:var(--primary)">Providers</a> to run tasks.</div>

          <label class="form-label">Allowed Tools</label>
          <div class="chips" id="ni-tools">
            ${TOOL_NAMES.map(t => `<div class="chip ${selected.has(t)?'on':''}" onclick="window._toggleTool('${t}')" id="chip-${t}">${t}</div>`).join('')}

        </div>

          </div>
        </div>

          Launch Agent

    window._toggleTool = (t) => {
      selected.has(t) ? selected.delete(t) : selected.add(t);

      const goal = document.getElementById('ni-goal').value.trim();

      const provSel = document.getElementById('ni-provider');
      const task = {
        id: uid(), goal, status: 'pending',

        requireApproval: document.getElementById('ni-approval').checked,

      DB.addLog('info', `Task created: ${goal}`);

  memory() {

    let filter = 'all';

    const typeColor = { short_term:'var(--muted)', long_term:'var(--primary)', task:'var(--warn)', project:'#7c6ff7' };

    const render = () => {
      const mem = DB.memory();
      const search = document.getElementById('mem-search')?.value?.toLowerCase() || '';
      const list = mem.filter(m =>
        (filter === 'all' || m.memoryType === filter) &&
        (!search || m.content.toLowerCase().includes(search))
      );
      document.getElementById('mem-list').innerHTML = list.length === 0
        ? '<div class="empty"><div class="empty-icon">◈</div><div>No memory entries</div></div>'
        : list.map(m => `
          <div class="card" style="margin-bottom:8px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

              <span style="font-size:11px;color:var(--muted);margin-right:8px">${timeAgo(m.createdAt)}</span>

      <div class="filter-row">${types.map(t=>`<div class="filter-chip ${t==='all'?'on':''}" onclick="window._memFilter('${t}')">${t.replace(/_/g,' ')}</div>`).join('')}</div>
      <div id="mem-list"></div>`;

    window._memFilter = (f) => { filter = f; document.querySelectorAll('.filter-chip').forEach(el=>el.classList.toggle('on',el.textContent.replace(/ /g,'_')===f||el.textContent===f)); render(); };
    window._memRender = render;
    window._delMem = (id) => { DB.delMemory(id); render(); };
    window._clearMemory = () => { if (confirm('Clear all memory?')) { LS.set('halo_memory',[]); render(); } };
    render();
  },

  skills() {
    const c = document.getElementById('content');
    const esc = (t) => String(t).replace(/[&<>"]/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[ch]));
    const draw = () => {
      const ix = SKILLS.index();
      c.innerHTML = `
        <div class="card" style="max-width:720px">
          <div class="card-title">Skill libraries (GitHub)</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Any public repo with <code>SKILL.md</code> folders works. One per line: <code>owner/repo</code> or <code>owner/repo@branch</code>. The agent sees each skill's name and description and loads the full instructions only when a task needs them.</div>
          <textarea class="form-input" id="sk-sources" rows="3">${esc(SKILLS.sources().join('\n'))}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-primary btn-sm" id="sk-save">Save &amp; refresh</button>
            <span id="sk-status" style="font-size:12px;color:var(--muted);align-self:center">${ix.updatedAt ? `${ix.skills.length} skills · updated ${new Date(ix.updatedAt).toLocaleString()}` : 'Not indexed yet'}</span>
          </div>
          ${(ix.errors || []).length ? `<div style="color:var(--warn);font-size:12px;margin-top:8px">${ix.errors.map(esc).join('<br>')}</div>` : ''}
        </div>
        <div class="card" style="max-width:720px">
          <div class="card-title">Indexed skills</div>
          ${ix.skills.length ? ix.skills.map(s => `
            <div class="toggle-row"><div class="toggle-info">
              <div class="label">${esc(s.name)} <span style="font-size:11px;color:var(--muted)">${esc(s.source)}</span></div>
              <div class="desc">${esc(s.description)}</div>
            </div></div>`).join('') : '<div style="color:var(--muted);font-size:13px">No skills yet. Tap Save &amp; refresh.</div>'}
        </div>`;
      document.getElementById('sk-save').onclick = async () => {
        const list = document.getElementById('sk-sources').value.split('\n').map(x => x.trim()).filter(Boolean);
        try { list.forEach(x => SKILLS.parseSource(x)); } catch (e) { toast(e.message, 'var(--warn)'); return; }
        DB.saveSettings({ ...DB.settings(), skillSources: list });
        document.getElementById('sk-status').textContent = 'Refreshing…';
        await SKILLS.refresh(m => { const el = document.getElementById('sk-status'); if (el) el.textContent = m; });
        draw();
        toast(`${SKILLS.index().skills.length} skills indexed.`);
      };
    };
    draw();
  },

  providers() {
    const c = document.getElementById('content');
    const s = DB.settings();
    const active = s.defaultProvider || 'local';

    c.innerHTML = `
      <div class="card" style="max-width:560px">
        <div class="card-title">Model Providers</div>
        ${Object.entries(PROVIDERS).map(([id, p]) => ({ id, ...p, modelHint: p.models[0] || 'no model set' })).map(p => `
          <div class="toggle-row">
            <div class="toggle-info">
              <div class="label">${p.label}</div>
              <div class="desc">${p.urlField && !p.urlRequired ? (s[p.urlField] || p.urlHint) : p.urlField ? (s[p.keyField] && s[p.urlField] ? '✓ Configured' : 'Not configured') : (s[p.keyField] ? '✓ Key configured' : 'No key')} · ${s[p.modelField] || p.modelHint}${active===p.id?' · <b style="color:var(--primary)">default</b>':''}</div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="window._editProv('${p.id}')">Edit</button>
          </div>`).join('')}
        <div class="form-group" style="margin-top:16px">
          <label class="form-label">GitHub Personal Access Token</label>
          <input class="form-input" id="gh-token" type="password" placeholder="ghp_…" value="${s.githubToken||''}"/>

        </div>
        <button class="btn btn-primary" onclick="window._saveGhToken()" style="margin-bottom:8px">Save GitHub Token</button>
      </div>
      <div class="card" style="max-width:560px">
        <div class="card-title">Arkon knowledge hub</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Self-hosted wiki from <code>arkon-local-setup.sh</code>. Lets the agent search and read it with the arkon_search / arkon_read tools.</div>
        <div class="form-group"><label class="form-label">API URL</label>
          <input class="form-input" id="ak-url" placeholder="http://127.0.0.1:5055" value="${s.arkonUrl||''}"/></div>
        <div class="form-group"><label class="form-label">Email</label>
          <input class="form-input" id="ak-email" placeholder="admin@arkon.local" value="${s.arkonEmail||''}"/></div>
        <div class="form-group"><label class="form-label">Password</label>
          <input class="form-input" id="ak-pass" type="password" value="${s.arkonPassword||''}"/></div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-primary btn-sm" onclick="window._saveArkon()">Save &amp; test</button>
          <span id="ak-status" style="font-size:12px;color:var(--muted)"></span>
        </div>
      </div>
      <div id="prov-edit-area"></div>`;

    window._saveArkon = async () => {
      DB.saveSettings({ ...DB.settings(),
        arkonUrl: document.getElementById('ak-url').value.trim(),
        arkonEmail: document.getElementById('ak-email').value.trim(),
        arkonPassword: document.getElementById('ak-pass').value });
      ARKON.token = null;
      const out = document.getElementById('ak-status');
      out.textContent = 'Testing…';
      try {
        const pages = await ARKON.get('/api/wiki/pages?limit=500');
        out.textContent = `Connected: ${pages.length} wiki page(s).`;
      } catch (e) { out.textContent = e.message; }
    };

    window._saveGhToken = () => {
      const token = document.getElementById('gh-token').value.trim();
      DB.saveSettings({ ...DB.settings(), githubToken: token });
      toast('GitHub token saved.');
    };

    window._editProv = (id) => {
      const p = PROVIDERS[id];
      const s = DB.settings();
      document.getElementById('prov-edit-area').innerHTML = `
        <div class="card" style="max-width:560px;border-color:var(--primary)">
          <div class="card-title">${p.label}</div>
          ${p.note ? `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${p.note}</div>` : ''}
          ${p.urlField ? `<div class="form-group">
            <label class="form-label">Server URL (OpenAI-compatible)</label>
            <input class="form-input" id="pe-url" placeholder="${p.urlHint}" value="${s[p.urlField]||''}"/>
          </div>` : ''}
          <div class="form-group">
            <label class="form-label">API Key${p.keyOptional ? ' (optional)' : ''}</label>
            <input class="form-input" id="pe-key" type="password" placeholder="${p.keyHint}" value="${s[p.keyField]||''}"/>
          </div>
          <div class="form-group">
            <label class="form-label">Model</label>
            <input class="form-input" id="pe-model" list="pe-models" placeholder="model id" value="${s[p.modelField]||p.models[0]||''}"/>
            <datalist id="pe-models">${p.models.map(m=>`<option value="${m}">`).join('')}</datalist>
            ${p.urlField ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="window._detectModels('${id}')">Detect installed models</button><span id="pe-detect" style="font-size:12px;color:var(--muted);margin-left:8px"></span>` : ''}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary btn-sm" onclick="window._saveProv('${id}','${p.keyField}','${p.modelField}')">Save</button>
            <button class="btn btn-primary btn-sm" onclick="window._setDefault('${id}')">Set as Default</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('prov-edit-area').innerHTML=''">Cancel</button>
          </div>
        </div>`;
    };

    window._detectModels = async (id) => {
      const p = PROVIDERS[id];
      const base = (document.getElementById('pe-url').value.trim() || p.urlHint || '').replace(/\/+$/, '');
      const key = document.getElementById('pe-key').value.trim();
      const out = document.getElementById('pe-detect');
      out.textContent = 'Checking…';
      try {
        const r = await fetch(`${base}/models`, { headers: key ? { 'Authorization': `Bearer ${key}` } : {} });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const ids = ((await r.json()).data || []).map(m => m.id).filter(Boolean);
        document.getElementById('pe-models').innerHTML = ids.map(m => `<option value="${m}">`).join('');
        if (ids.length && !document.getElementById('pe-model').value) document.getElementById('pe-model').value = ids[0];
        out.textContent = ids.length ? `Found ${ids.length}: ${ids.slice(0, 6).join(', ')}${ids.length > 6 ? '…' : ''}` : 'Server is up but has no models. Pull one first.';
      } catch (e) {
        out.textContent = `Could not reach ${base} (${e.message}). Is the server running?`;
      }
    };

    window._saveProv = (id, keyField, modelField) => {
      const key = document.getElementById('pe-key').value.trim();
      const model = document.getElementById('pe-model').value.trim() || PROVIDERS[id].models[0] || '';
      const urlEl = document.getElementById('pe-url');
      const extra = urlEl && PROVIDERS[id].urlField ? { [PROVIDERS[id].urlField]: urlEl.value.trim() } : {};
      DB.saveSettings({ ...DB.settings(), [keyField]: key, [modelField]: model, ...extra });
      toast(`${PROVIDERS[id].label} saved.`);
      PAGES.providers();
    };

    window._setDefault = (id) => {
      DB.saveSettings({ ...DB.settings(), defaultProvider: id });
      toast(`${PROVIDERS[id].label} set as default provider.`);
      PAGES.providers();
    };
  },

    c.innerHTML = `

      <div id="log-list" class="card" style="padding:0 0 0 0"></div>`;

    window._logFilter = (f) => { filter = f; render(); };

// TASK DETAIL MODAL
// ────────────────────────────────────────────────────────────────────────────
function openTask(id) {
  const task = DB.task(id);
  if (!task) return;
  document.getElementById('modal-title').textContent = task.goal;
  renderModal(task);
  document.getElementById('task-overlay').classList.add('open');
  // Auto-refresh for active tasks
  if (task.status === 'running' || task.status === 'waiting_for_approval') {
    const t = setInterval(() => {
      const updated = DB.task(id);
      if (!updated) { clearInterval(t); return; }
      renderModal(updated);
      if (updated.status !== 'running' && updated.status !== 'waiting_for_approval') clearInterval(t);
    }, 1500);
    document.getElementById('task-overlay').dataset.refreshTimer = t;
  }
}

function renderModal(task) {
  const steps = task.steps || [];
  const stepColors = {
    start:'var(--muted)', thought:'var(--primary)', tool_call:'var(--warn)',
    tool_result:'var(--text)', result:'#00cc7a', error:'var(--danger)',
    approval_request:'var(--warn)', rejected:'var(--danger)'
  };

  document.getElementById('modal-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      ${pill(task.status)}
      <span style="color:var(--muted);font-size:12px">${timeAgo(task.createdAt)}</span>
      ${task.status === 'running' ? '<div class="spinner"></div>' : ''}
    </div>

    ${task.status === 'waiting_for_approval' && task.pendingApproval ? `
      <div class="approval-banner">
        <div class="approval-title">⚠ Approval Required</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">The agent wants to call a risky tool:</div>
        <div class="approval-code">${task.pendingApproval.toolName}(${JSON.stringify(task.pendingApproval.toolArgs, null, 2)})</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="resumeTask('${task.id}',true);closeModal()">✓ Approve</button>
          <button class="btn btn-danger btn-sm" onclick="resumeTask('${task.id}',false);closeModal()">✕ Reject</button>
        </div>
      </div>` : ''}

    <div class="step-timeline">
      ${steps.map((s, i) => `
        <div class="step-item">
          <div class="step-line">
            <div class="step-dot" style="background:${stepColors[s.stepType]||'var(--muted)'}"></div>
            ${i < steps.length-1 ? '<div class="step-connector"></div>' : ''}
          </div>
          <div class="step-body">
            <div class="step-type">${s.stepType.replace(/_/g,' ')}</div>
            <div class="step-content ${s.stepType}">${s.content}</div>
          </div>
        </div>`).join('')}
      ${steps.length === 0 ? '<div style="color:var(--muted);font-size:13px;padding:10px 0">No steps yet…</div>' : ''}
    </div>

    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      ${(task.status === 'running' || task.status === 'pending') ? `<button class="btn btn-danger btn-sm" onclick="DB.updateTask('${task.id}',{status:'failed',error:'Cancelled'});delete activeTasks['${task.id}'];closeModal()">Cancel</button>` : ''}
      ${task.status === 'failed' && !activeTasks[task.id] ? `<button class="btn btn-ghost btn-sm" onclick="DB.updateTask('${task.id}',{status:'pending',error:null});runAgent('${task.id}');closeModal()">Retry</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="if(confirm('Delete task?')){DB.saveTasks(DB.tasks().filter(t=>t.id!=='${task.id}'));closeModal()}">Delete</button>
    </div>`;
}

function closeModal() {
  const overlay = document.getElementById('task-overlay');
  const t = overlay.dataset.refreshTimer;
  if (t) { clearInterval(Number(t)); delete overlay.dataset.refreshTimer; }
  overlay.classList.remove('open');
}

document.getElementById('task-overlay').addEventListener('click', e => {
  if (e.target.id === 'task-overlay') closeModal();
});

function speak(text) {
  const clean = String(text || '').replace(/\*[^*]*\*/g, ' ').replace(/\s+/g, ' ').trim();

function saveDownload(name, blob) {

      const r = new FileReader();
      r.onload = () => resolve(NATIVE.saveFile(name, String(r.result).split(',')[1], blob.type || 'application/octet-stream') || '');

}

  // ── Card import/export ──
  fromCard(json) {
    const d = json && (json.spec === 'chara_card_v2' || json.spec === 'chara_card_v3') ? (json.data || {}) : (json || {});
    if (!d.name) throw new Error('Not a character card (no name).');
    const tags = Array.isArray(d.tags) ? d.tags.map(String) : [];
    const nx = (d.extensions && (d.extensions.halo || d.extensions.nexus)) || {};
    const c = { ...CHARS.blank(),
      name: String(d.name), description: d.description || '', personality: d.personality || '', scenario: d.scenario || '',
      first_mes: d.first_mes || '', mes_example: d.mes_example || '', creator_notes: d.creator_notes || '',
      system_prompt: d.system_prompt || '', post_history_instructions: d.post_history_instructions || '',
      alternate_greetings: Array.isArray(d.alternate_greetings) ? d.alternate_greetings.map(String) : [],
      tags, creator: d.creator || '', character_version: d.character_version || '',
      mature: !!nx.mature || tags.some(t => MATURE_TAGS.test(t.trim())),
      adult: !!nx.adult };
    return c;
  },
  toCard(c) {
    const data = { name: c.name, description: c.description, personality: c.personality, scenario: c.scenario,
      first_mes: c.first_mes, mes_example: c.mes_example, creator_notes: c.creator_notes, system_prompt: c.system_prompt,
      post_history_instructions: c.post_history_instructions, alternate_greetings: c.alternate_greetings || [],
      tags: c.tags || [], creator: c.creator || 'Halo', character_version: c.character_version || '1.0',
      extensions: { halo: { mature: !!c.mature, adult: !!c.adult } } };
    // V1 fields at the top level too, as SillyTavern writes them.
    return { name: c.name, description: c.description, personality: c.personality, scenario: c.scenario,
      first_mes: c.first_mes, mes_example: c.mes_example, spec: 'chara_card_v2', spec_version: '2.0', data };
  },
  async importFile(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    let card, avatar = '';
    if (buf[0] === 0x89 && buf[1] === 0x50) {
      card = JSON.parse(PNGCARD.read(buf));
      avatar = await shrinkImage(new Blob([buf], { type: 'image/png' }));
    } else {
      card = JSON.parse(new TextDecoder().decode(buf));
    }
    const c = CHARS.fromCard(card);
    c.avatar = avatar;
    return CHARS.upsert(c);
  },
  async exportPng(c) {
    const base = c.avatar ? await (await fetch(c.avatar)).blob() : null;
    const png = await renderCardImage(c, base);
    const out = PNGCARD.write(new Uint8Array(await png.arrayBuffer()), JSON.stringify(CHARS.toCard(c)));
    return saveDownload(`${(c.name || 'character').replace(/\s+/g, '_')}.png`, new Blob([out], { type: 'image/png' }));
  },
  exportJson(c) {

  }
};

// PNG tEXt chunks: SillyTavern stores cards as base64 JSON under "chara" (V2) or "ccv3" (V3).
const PNGCARD = (() => {
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc = (bytes) => { let c = 0xffffffff; for (const b of bytes) c = T[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  const u32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
  function chunks(buf) {
    const SIG = [137, 80, 78, 71, 13, 10, 26, 10];
    if (!SIG.every((v, i) => buf[i] === v)) throw new Error('Not a PNG file.');
    const out = []; let o = 8;
    while (o + 8 <= buf.length) {
      const len = u32(buf, o), type = String.fromCharCode(...buf.subarray(o + 4, o + 8));
      out.push({ type, start: o, end: o + 12 + len, data: buf.subarray(o + 8, o + 8 + len) });
      o += 12 + len;
      if (type === 'IEND') break;
    }
    return out;
  }
  const b64ToUtf8 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.trim()), ch => ch.charCodeAt(0)));
  const utf8ToB64 = (s) => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin); };
  return {
    read(buf) {
      const texts = chunks(buf).filter(c => c.type === 'tEXt').map(c => {
        const z = c.data.indexOf(0);
        return { key: String.fromCharCode(...c.data.subarray(0, z)).toLowerCase(), text: String.fromCharCode(...c.data.subarray(z + 1)) };
      });
      const hit = texts.find(t => t.key === 'ccv3') || texts.find(t => t.key === 'chara');
      if (!hit) throw new Error('This PNG has no character card inside.');
      return b64ToUtf8(hit.text);
    },
    write(buf, json) {
      const keep = chunks(buf).filter(c => !(c.type === 'tEXt' && /^(chara|ccv3)\0/i.test(String.fromCharCode(...c.data.subarray(0, 6)))));
      const payload = new TextEncoder().encode('chara\0' + utf8ToB64(json));
      const typeData = new Uint8Array(4 + payload.length);
      typeData.set([116, 69, 88, 116]); typeData.set(payload, 4); // "tEXt"
      const chunk = new Uint8Array(12 + payload.length);
      const dv = new DataView(chunk.buffer);
      dv.setUint32(0, payload.length); chunk.set(typeData, 4); dv.setUint32(8 + payload.length, crc(typeData));
      const parts = [buf.subarray(0, 8)];
      for (const c of keep) { if (c.type === 'IEND') parts.push(chunk); parts.push(buf.subarray(c.start, c.end)); }
      const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
      return out;
    }
  };
})();

function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bad image')); i.src = src; });
}
async function shrinkImage(blob, max = 256) {
  try {
    const url = URL.createObjectURL(blob); const img = await loadImage(url); URL.revokeObjectURL(url);
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.85);
  } catch { return ''; }
}
async function renderCardImage(c, avatarBlob) {
  const cv = document.createElement('canvas'); cv.width = 400; cv.height = 600;
  const g = cv.getContext('2d');
  g.fillStyle = '#111116'; g.fillRect(0, 0, 400, 600);
  if (avatarBlob) {
    const url = URL.createObjectURL(avatarBlob); const img = await loadImage(url); URL.revokeObjectURL(url);
    const k = Math.max(400 / img.width, 600 / img.height);
    g.drawImage(img, (400 - img.width * k) / 2, (600 - img.height * k) / 2, img.width * k, img.height * k);
  } else {
    g.fillStyle = '#00ff9f'; g.font = 'bold 160px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText((c.name || '?').trim().charAt(0).toUpperCase(), 200, 270);
    g.fillStyle = '#e8e8f0'; g.font = 'bold 30px sans-serif'; g.fillText(c.name || '', 200, 470);
  }
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

// ────────────────────────────────────────────────────────────────────────────
// CHAT
// ────────────────────────────────────────────────────────────────────────────
const CHAT = {
  get: (id) => LS.get(`halo_chat_${id}`, []),
  set: (id, msgs) => LS.set(`halo_chat_${id}`, msgs.slice(-300)),
  start(c, greetingIdx = 0) {
    const greetings = [c.first_mes, ...(c.alternate_greetings || [])].filter(Boolean);
    const msgs = greetings.length ? [{ role: 'assistant', content: greetings[greetingIdx % greetings.length], ts: Date.now(), greeting: greetingIdx }] : [];
    CHAT.set(c.id, msgs); return msgs;
  },
  buildMessages(c, history) {
    const m = (t) => CHARS.macros(t, c);
    const persona = CHARS.persona();
    const sys = [
      m(c.system_prompt || 'You are {{char}} in an ongoing conversation with {{user}}. Stay in character, write only {{char}}\'s replies (dialogue and *actions*), and never speak or act for {{user}}.'),
      c.description && m(`About {{char}}: ${c.description}`),
      c.personality && m(`{{char}}'s personality: ${c.personality}`),
      c.scenario && m(`Scenario: ${c.scenario}`),
      persona.description && m(`About {{user}}: ${persona.description}`),
      c.mes_example && m(`Example of how {{char}} talks:\n${c.mes_example.replace(/<START>/gi, '').trim()}`),
      m(CONTENT.rule(c)),
      document.body.classList.contains('glasses') ? 'Replies are shown on small AR glasses: keep them to 1-3 short sentences.' : '',
      c.post_history_instructions && m(c.post_history_instructions)
    ].filter(Boolean).join('\n\n');

    // Most recent history that fits the budget, oldest first, roles alternating.
    const BUDGET = 24000; let used = 0; const kept = [];
    for (let i = history.length - 1; i >= 0; i--) {
      used += history[i].content.length; if (used > BUDGET && kept.length) break;
      kept.unshift({ role: history[i].role, content: m(history[i].content) });
    }
    if (!kept.length || kept[0].role !== 'user') kept.unshift({ role: 'user', content: '[Start of chat]' });
    const merged = [];
    for (const x of kept) {
      const last = merged[merged.length - 1];
      if (last && last.role === x.role) last.content += '\n\n' + x.content; else merged.push({ ...x });
    }
    return [{ role: 'system', content: sys }, ...merged];
  },
  clean(c, text) {
    let t = String(text || '').trim();
    const user = CHARS.persona().name;
    t = t.replace(new RegExp(`^${(c.name || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}:\\s*`, 'i'), '');
    const cut = t.search(new RegExp(`\\n\\s*(${user.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}|\\{\\{user\\}\\}):`, 'i'));
    return (cut > 0 ? t.slice(0, cut) : t).trim();
  },
  async reply(c, history) {
    return CHAT.clean(c, await callLLM(CHAT.buildMessages(c, history), false));
  }
};

const GLASSES = {

  keyLog: [],

    const scope = overlay || (document.body.classList.contains('menu-open') ? document.querySelector('.sidebar') : document);
    return [...scope.querySelectorAll('button, a[href], input:not([type=hidden]):not([disabled]), select, textarea, [tabindex="0"]')]

window.haloBack = () => {
  if (document.querySelector('.overlay.open')) { closeModal(); return true; }
  if (document.body.classList.contains('menu-open')) { document.body.classList.remove('menu-open'); return true; }
  if (currentPage === 'chat') { navigate('characters'); return true; }
  if (currentPage !== 'home') { navigate('home'); return true; }
  return false;
};
document.addEventListener('keydown', (e) => {
  GLASSES.keyLog.unshift(`${new Date().toLocaleTimeString()}  key=${e.key}  code=${e.code}  keyCode=${e.keyCode}`);
  GLASSES.keyLog.length = Math.min(GLASSES.keyLog.length, 15);
  const kl = document.getElementById('dev-keylog'); if (kl) kl.textContent = GLASSES.keyLog.join('\n');
  document.body.classList.add('kbd');
  const a = document.activeElement;
  const typing = a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'submit', 'range'].includes(a.type)));
  if (e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack') { if (window.haloBack()) e.preventDefault(); return; }
  if (e.key === 'Enter' && a && a.getAttribute('tabindex') === '0' && !typing) { e.preventDefault(); a.click(); return; }
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  if (typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (a && a.tagName === 'TEXTAREA' && a.value.includes('\n') && !document.body.classList.contains('glasses')) return;
  const list = GLASSES.focusables(); if (!list.length) return;
  const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';
  let i = list.indexOf(a);
  i = i < 0 ? (fwd ? 0 : list.length - 1) : (i + (fwd ? 1 : -1) + list.length) % list.length;
  e.preventDefault();
  list[i].focus({ preventScroll: true });
  list[i].scrollIntoView({ block: 'nearest' });
});
document.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));

    const box = document.getElementById('chat-msgs');
    const fmt = (t) => esc(CHARS.macros(t, ch)).replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
    const draw = () => {
      const greetings = [ch.first_mes, ...(ch.alternate_greetings || [])].filter(Boolean);
      box.innerHTML = msgs.map((m, i) => `
        <div class="bubble ${m.role}" tabindex="0">
          ${m.role === 'assistant' ? `<div class="who">${esc(ch.name)}</div>` : ''}
          <div>${fmt(m.content)}</div>
          ${i === msgs.length - 1 && m.role === 'assistant' && !busy ? `<div class="bubble-actions">
            ${msgs.length === 1 && greetings.length > 1 ? '<button class="btn btn-ghost btn-xs" onclick="window._chatGreeting()">Next greeting</button>' : ''}
            ${msgs.length > 1 ? '<button class="btn btn-ghost btn-xs" onclick="window._chatRegen()">Regenerate</button>' : ''}
            ${msgs.length > 1 ? '<button class="btn btn-ghost btn-xs" onclick="window._chatUndo()">Undo</button>' : ''}
          </div>` : ''}
        </div>`).join('') + (busy ? `<div class="bubble assistant"><span class="spinner"></span></div>` : '');
      box.scrollTop = box.scrollHeight;
    };
    const run = async () => {
      busy = true; draw(); document.getElementById('chat-send').disabled = true;
      try {
        const text = await CHAT.reply(ch, msgs);
        msgs.push({ role: 'assistant', content: text || '…', ts: Date.now() });
        CHAT.set(ch.id, msgs);
        if (DB.settings().speakReplies) speak(CHARS.macros(text, ch));
        if (DB.settings().hudMirror && NATIVE && NATIVE.hudInfo) { try { GTOOLS.hud({ mode: 'text', title: ch.name, text: CHARS.macros(text, ch) }); } catch {} }
      } catch (e) {
        toast(e.message, 'var(--danger)'); DB.addLog('error', `Chat with ${ch.name}: ${e.message}`);
      }
      busy = false; document.getElementById('chat-send').disabled = false; draw();
      if (GLASSES.on()) (document.getElementById('chat-mic') || document.getElementById('chat-text')).focus();
    };
    window._chatSend = () => {
      const ta = document.getElementById('chat-text'); const t = ta.value.trim();
      if (!t || busy) return;
      msgs.push({ role: 'user', content: t, ts: Date.now() }); CHAT.set(ch.id, msgs); ta.value = ''; run();
    };
    window._chatRegen = () => { if (busy) return; if (msgs[msgs.length - 1].role === 'assistant') msgs.pop(); run(); };
    window._chatUndo = () => {
      if (busy) return;
      while (msgs.length > 1 && msgs[msgs.length - 1].role === 'assistant') msgs.pop();
      if (msgs.length > 1 && msgs[msgs.length - 1].role === 'user') { document.getElementById('chat-text').value = msgs.pop().content; }
      CHAT.set(ch.id, msgs); draw();
    };
    window._chatGreeting = () => { msgs = CHAT.start(ch, (msgs[0].greeting || 0) + 1); draw(); };
    window._chatReset = () => { if (confirm(`Start a new chat with ${ch.name}? The current one is cleared.`)) { msgs = CHAT.start(ch); draw(); } };

  },

  const o = document.getElementById('task-overlay');

  document.getElementById('modal-body').innerHTML = html;

  if (document.body.classList.contains('kbd')) setTimeout(() => { const f = GLASSES.focusables()[0]; if (f) f.focus(); }, 50);
