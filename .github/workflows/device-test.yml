name: Device test (Moto G 2025 profile)

# Runs both APKs on an Android 15 emulator set up like a Moto G (2025): 720x1604 HD+ at 280 dpi,
# 4 GB RAM, slightly larger font. Drives the real apps (debug builds) and checks logcat for crashes.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'tests/device/**'
      - '.github/workflows/device-test.yml'

jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APKs (with the emulator's x86_64 ABI)
        working-directory: android
        run: gradle --no-daemon assembleDebug -PnexusAbis=arm64-v8a,armeabi-v7a,x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 15 emulator (Moto G 2025 profile)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash tests/device/run.sh device-test-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-moto-g-2025
          path: device-test-out/
          retention-days: 14
