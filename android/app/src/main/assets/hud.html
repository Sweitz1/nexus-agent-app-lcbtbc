<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus HUD</title>
<style>
/* Shown on external display glasses. Pure black is transparent on birdbath/OLED optics. */
:root{--accent:#00e5ff;--accent2:#b388ff;--dim:#7f97a8;--fs:34px;--safe:6vh 8vw}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#e8fbff;font:var(--fs)/1.4 system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#wrap{position:absolute;inset:0;padding:var(--safe);display:flex;flex-direction:column}
#top{display:flex;justify-content:space-between;color:var(--dim);font-size:.55em;letter-spacing:.05em}
#main{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
#title{color:var(--accent2);font-size:.6em;margin-bottom:.3em}
#text{white-space:pre-wrap;overflow:hidden}
#scroll{position:absolute;inset:0;overflow:hidden}
#scroll div{white-space:pre-wrap;padding-top:40%}
.lyric{transition:all .3s;opacity:.35;margin:.15em 0;transform-origin:left center}
.lyric.on{opacity:1;color:var(--accent);transform:scale(1.04)}
#clock{font-size:3em;font-weight:200;text-align:center}
#date{text-align:center;color:var(--dim);font-size:.7em}
#toast{position:absolute;left:8vw;right:8vw;bottom:5vh;background:#0b1a22;border:2px solid var(--accent);border-radius:14px;padding:.4em .7em;font-size:.6em;display:none}
#bar{height:4px;background:#123;margin-top:.4em;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span id="mode">NEXUS</span><span id="status"></span></div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let state = { mode: 'clock' }, raf = null, toastT = null;
function clockTick() { if (state.mode !== 'clock') return; const d = new Date(); const c = $('#clock'); if (c) { c.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); $('#date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) + (state.next ? ' · ' + state.next : ''); } }
setInterval(clockTick, 1000);
function render() {
  cancelAnimationFrame(raf);
  const m = $('#main'); $('#mode').textContent = (state.mode || 'nexus').toUpperCase();
  if (state.fontSize) document.documentElement.style.setProperty('--fs', state.fontSize + 'px');
  if (state.safe != null) document.documentElement.style.setProperty('--safe', `${state.safe}vh ${state.safe * 1.3}vw`);
  if (state.mode === 'clock') { m.innerHTML = '<div id="clock"></div><div id="date"></div>'; clockTick(); }
  else if (state.mode === 'teleprompter') {
    m.innerHTML = `<div id="scroll"><div>${esc(state.text)}<div style="height:80vh"></div></div></div>`;
    const box = $('#scroll'), words = String(state.text || '').split(/\s+/).length, wpm = state.wpm || 150; let last = performance.now();
    const step = now => { const dt = (now - last) / 1000; last = now; if (!state.paused) box.scrollTop += (box.scrollHeight - box.clientHeight) / (words / wpm * 60) * dt; raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  } else if (state.mode === 'lyrics') {
    const lines = state.lines || []; const cur = state.index || 0;
    m.innerHTML = (state.title ? `<div id="title">${esc(state.title)}</div>` : '') + lines.slice(Math.max(0, cur - 2), cur + 4).map((l, i) => `<div class="lyric ${Math.max(0, cur - 2) + i === cur ? 'on' : ''}">${esc(l) || '♪'}</div>`).join('');
  } else if (state.mode === 'nowplaying') {
    const p = state.progress || 0;
    m.innerHTML = `<div id="title">${esc(state.app || 'Now playing')} ${state.playing === false ? '⏸' : '▶'}</div><div style="font-size:1.2em">${esc(state.title || '—')}</div><div style="color:var(--dim)">${esc(state.subtitle || '')}</div><div id="bar"><i style="width:${Math.round(p * 100)}%"></i></div>`;
  } else {
    m.innerHTML = (state.title ? `<div id="title">${esc(state.title)}</div>` : '') + `<div id="text">${esc(state.text || '')}</div>`;
    const t = $('#text'); if (t) { let fs = 1; while (t.scrollHeight > m.clientHeight && fs > 0.45) { fs -= 0.05; t.style.fontSize = fs + 'em'; } }
  }
}
window.hudUpdate = u => {
  if (u.toast) { const t = $('#toast'); t.textContent = u.toast; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', u.toastMs || 6000); }
  if (u.status != null) $('#status').textContent = u.status;
  const keys = Object.keys(u).filter(k => !['toast', 'toastMs', 'status'].includes(k));
  if (!keys.length) return;
  const sameLyrics = u.mode === 'lyrics' && state.mode === 'lyrics' && u.lines === undefined;
  state = sameLyrics || u.patch ? { ...state, ...u } : { ...u };
  render();
};
render();
</script>
</body>
</html>
