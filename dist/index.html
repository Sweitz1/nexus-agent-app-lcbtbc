// ────────────────────────────────────────────────────────────────────────────
// GLASSES TOOLS (ported from the prod app): device status, volume, brightness,
// media keys, settings shortcuts, head pose / nod-shake, notifications, HUD
// ────────────────────────────────────────────────────────────────────────────
const NATIVE_CB = {};
window.__haloCb = (id, ok, payload) => { const p = NATIVE_CB[id]; if (!p) return; delete NATIVE_CB[id]; ok ? p.resolve(payload) : p.reject(new Error((payload && payload.error) || 'native call failed')); };
window.__haloEvent = (type, payload) => {
  if (type === 'display') { DB.addLog('info', `Display: ${JSON.stringify(payload)}`); if (currentPage === 'glasses') PAGES.glasses(); }
};
function nativeAsync(method, ...args) {
  return new Promise((resolve, reject) => {
    const id = uid(); NATIVE_CB[id] = { resolve, reject };
    try { NATIVE[method](id, ...args); } catch (e) { delete NATIVE_CB[id]; reject(e); }
    setTimeout(() => { if (NATIVE_CB[id]) { delete NATIVE_CB[id]; reject(new Error(`${method} timed out`)); } }, 35000);
  });
}
function needNative(what = 'This tool') {
  if (!NATIVE || !NATIVE.deviceStatus) throw new Error(`${what} needs the Halo Android app (glasses or phone).`);
}
const parseJ = (s, d = {}) => { try { return JSON.parse(s); } catch { return d; } };

const GTOOLS = {
  status() { needNative('Device status'); return parseJ(NATIVE.deviceStatus()); },
  async headGesture(timeoutMs = 6000) {
    needNative('Head gestures');
    const r = await nativeAsync('headGesture', timeoutMs);
    const s = DB.settings();
    return r.axis === (s.nodAxis || 'x') ? 'nod' : r.axis === (s.shakeAxis || 'y') ? 'shake' : r.axis === 'none' ? 'none' : `unclear (${r.axis})`;
  },
  askYesNo(question, timeoutS = 15) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ans) => { if (done) return; done = true; closeModal(); resolve(ans); };
      window._yn = finish;
      openModal('Question', `<p style="font-size:1.15em;margin-bottom:14px">${esc(question)}</p>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="window._yn('yes')">Yes</button><button class="btn btn-ghost" onclick="window._yn('no')">No</button></div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">${NATIVE && NATIVE.headGesture ? 'Or nod for yes, shake your head for no.' : ''}</div>`);
      speak(question);
      const deadline = Date.now() + timeoutS * 1000;
      const loop = async () => {
        while (!done && Date.now() < deadline && NATIVE && NATIVE.headGesture) {
          try { const g = await GTOOLS.headGesture(Math.min(5000, deadline - Date.now())); if (g === 'nod') return finish('yes'); if (g === 'shake') return finish('no'); }
          catch { break; }
        }
      };
      loop();
      setTimeout(() => finish('no answer'), timeoutS * 1000);
    });
  },
  hud(update) { needNative('HUD'); const info = parseJ(NATIVE.hudInfo()); if (!info.hud) { const r = parseJ(NATIVE.hudStart()); if (r.error) throw new Error(r.error); } NATIVE.hudPost(JSON.stringify(update)); }
};

Object.assign(TOOLS, {
  glasses_status: { desc: 'Battery, charging, temperature, volume, network, Bluetooth, storage, memory, brightness and sensors of the glasses/device. Args: {}', risky: false,
    async run() { return GTOOLS.status(); } },
  glasses_volume: { desc: 'Set media volume. Args: {"percent": 0-100}', risky: false,
    async run({ percent }) { needNative(); return NATIVE.setVolume(Math.round(Number(percent) || 0)); } },
  glasses_brightness: { desc: 'Set display brightness for Halo. Args: {"percent": 1-100} or {"auto": true} to follow the system', risky: false,
    async run({ percent, auto }) { needNative(); return NATIVE.setBrightness(auto ? -1 : Math.max(1, Math.min(100, Number(percent) || 50)) / 100); } },
  media_control: { desc: 'Control the music/podcast app playing on the device. Args: {"action": "play|pause|play_pause|next|previous|stop"}', risky: false,
    async run({ action }) { needNative(); return NATIVE.mediaKey(String(action || 'play_pause')); } },
  glasses_settings: { desc: 'Open a system settings screen. Args: {"panel": "wifi|bluetooth|display|sound|battery|location|notifications|apps|storage|date|language|accessibility|developer|app"}', risky: false,
    async run({ panel }) { needNative(); return NATIVE.openSettings(String(panel || '')); } },
  head_pose: { desc: 'Current head orientation from the IMU (yaw, pitch, roll in degrees). Args: {}', risky: false,
    async run() { needNative('Head tracking'); return nativeAsync('headPose'); } },
  ask_yes_no: { desc: 'Ask the user a yes/no question on screen and aloud; they answer by nodding/shaking their head or tapping. Args: {"question": "...", "timeout_s": 15}', risky: false,
    async run({ question, timeout_s }) { return { answer: await GTOOLS.askYesNo(String(question || ''), Number(timeout_s) || 15) }; } },
  notifications_read: { desc: 'Recent notifications on this device (needs notification access). Args: {"app": "optional filter", "limit": 15, "since_minutes": optional}', risky: false,
    async run({ app = '', limit = 15, since_minutes } = {}) {
      needNative('Notifications');
      if (!NATIVE.notificationAccess()) return { error: 'Notification access is off. Ask the user to enable it: glasses_settings panel "notifications" → Halo.' };
      const since = since_minutes ? Date.now() - since_minutes * 60000 : 0; const f = String(app).toLowerCase();
      return parseJ(NATIVE.notificationsList(150), []).filter(n => n.time >= since && (!f || n.app.toLowerCase().includes(f) || n.package.includes(f))).slice(0, limit)
        .map(n => ({ time: new Date(n.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), app: n.app, title: n.title, text: String(n.text).slice(0, 220), key: n.key }));
    } },
  notifications_dismiss: { desc: 'Dismiss a notification. Args: {"key": "from notifications_read"}', risky: true,
    async run({ key }) { needNative(); return NATIVE.notificationDismiss(String(key)) ? 'dismissed' : 'notification access not active'; } },
  hud_control: { desc: 'Show content on USB-C display glasses (Lenovo Legion/T1, XREAL, Viture, Rokid, RayNeo Air). Args: {"action": "text|clock|teleprompter|toast|stop", "text": "...", "title": "optional", "wpm": 150}', risky: false,
    async run({ action = 'text', text = '', title = '', wpm }) {
      needNative('HUD');
      if (action === 'stop') { NATIVE.hudStop(); return 'HUD stopped'; }
      if (action === 'toast') { GTOOLS.hud({ toast: String(text) }); return 'shown'; }
      GTOOLS.hud(action === 'clock' ? { mode: 'clock' } : action === 'teleprompter' ? { mode: 'teleprompter', text, wpm: Number(wpm) || 150 } : { mode: 'text', title, text });
      return `HUD: ${action}`;
    } }
});
const GLASSES_TOOL_NAMES = ['glasses_status', 'glasses_volume', 'glasses_brightness', 'media_control', 'glasses_settings', 'head_pose', 'ask_yes_no', 'notifications_read', 'notifications_dismiss', 'hud_control'];

// Glasses & Dev page: device controls card (Android only), added under the existing cards.
const _glassesPage = PAGES.glasses;
PAGES.glasses = function () {
  _glassesPage();
  const c = document.getElementById('content');
  const card = document.createElement('div');
  card.className = 'card'; card.style.maxWidth = '720px';
  if (!NATIVE || !NATIVE.deviceStatus) {
    card.innerHTML = `<div class="card-title">Device controls</div><div style="font-size:13px;color:var(--muted)">Battery, volume, brightness, media keys, head gestures, notifications and the HUD work in the Android app on the glasses or a phone.</div>`;
    c.insertBefore(card, c.children[1]); return;
  }
  const st = GTOOLS.status(); const s = DB.settings();
  const bat = st.battery || {}, au = st.audio || {}, net = st.network || {}, disp = st.display || {};
  const hud = parseJ(NATIVE.hudInfo());
  card.innerHTML = `
    <div class="card-title" style="display:flex;justify-content:space-between">Device controls <button class="btn btn-ghost btn-xs" onclick="PAGES.glasses()">Refresh</button></div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-label">Battery</div><div class="stat-value ${bat.percent < 20 ? 'r' : 'g'}">${bat.percent ?? '?'}%</div><div style="font-size:11px;color:var(--muted)">${bat.charging ? 'charging' : 'on battery'} · ${bat.temperatureC ?? '?'}°C</div></div>
      <div class="stat"><div class="stat-label">Network</div><div class="stat-value" style="font-size:18px">${esc(net.type || '?')}</div><div style="font-size:11px;color:var(--muted)">${esc(net.ip || '')}</div></div>
      <div class="stat"><div class="stat-label">Storage free</div><div class="stat-value" style="font-size:18px">${st.storage ? st.storage.freeGB + ' GB' : '?'}</div></div>
      <div class="stat"><div class="stat-label">Memory free</div><div class="stat-value" style="font-size:18px">${st.memoryFreeMB ?? '?'} MB</div></div>
    </div>
    <div class="form-group"><label class="form-label">Media volume: <span id="gv-v">${au.mediaPercent ?? 50}</span>%</label><input type="range" min="0" max="100" value="${au.mediaPercent ?? 50}" id="gv" style="width:100%"></div>
    <div class="form-group"><label class="form-label">Brightness (this app): <span id="gb-v">${disp.appBrightness === 'system' ? 'system' : disp.appBrightness + '%'}</span></label>
      <div style="display:flex;gap:8px;align-items:center"><input type="range" min="1" max="100" value="${disp.appBrightness === 'system' ? 70 : disp.appBrightness}" id="gb" style="flex:1"><button class="btn btn-ghost btn-xs" id="gb-auto">System</button></div></div>
    <div class="form-label">Media</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${['previous', 'play_pause', 'next', 'stop'].map(a => `<button class="btn btn-ghost btn-sm" onclick="toast(HaloNative.mediaKey('${a}'))">${{ previous: '⏮', play_pause: '⏯', next: '⏭', stop: '⏹' }[a]}</button>`).join('')}</div>
    <div class="form-label">System settings</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${['wifi', 'bluetooth', 'display', 'sound', 'battery', 'notifications', 'developer'].map(p => `<button class="btn btn-ghost btn-xs" onclick="toast(HaloNative.openSettings('${p}'))">${p}</button>`).join('')}</div>
    <div class="form-label">Head gestures</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" id="cal-nod">Calibrate nod</button><button class="btn btn-ghost btn-sm" id="cal-shake">Calibrate shake</button>
      <button class="btn btn-ghost btn-sm" id="yn-test">Test yes/no</button><button class="btn btn-ghost btn-sm" id="pose">Head pose</button>
      <span style="font-size:12px;color:var(--muted)">nod axis ${esc(s.nodAxis || 'x')} · shake axis ${esc(s.shakeAxis || 'y')}</span></div>
    <div class="form-label">Notifications</div>
    <div style="font-size:13px;margin-bottom:12px">${NATIVE.notificationAccess() ? '✓ Access on: the agent can read notifications (notifications_read).' : 'Access off.'}
      <button class="btn btn-ghost btn-xs" onclick="toast(HaloNative.openSettings('notifications'))">${NATIVE.notificationAccess() ? 'Manage' : 'Turn on'}</button></div>
    <div class="form-label">HUD on USB-C display glasses</div>
    <div style="font-size:13px;margin-bottom:6px">${hud.connected ? `Connected: ${esc(hud.name)} ${hud.width}×${hud.height} @${hud.refreshHz}Hz${hud.hud ? ' · HUD on' : ''}` : 'No external display. Plug in Lenovo Legion/T1, XREAL, Viture, Rokid or RayNeo Air glasses over USB-C.'}</div>
    ${hud.connected ? `<div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="TOOLS.hud_control.run({action:'clock'}).then(toast).catch(e=>toast(e.message,'var(--warn)'))">Clock</button>
      <button class="btn btn-ghost btn-sm" onclick="TOOLS.hud_control.run({action:'text',title:'Halo',text:'Hello from Halo'}).then(toast).catch(e=>toast(e.message,'var(--warn)'))">Test text</button>
      <button class="btn btn-ghost btn-sm" onclick="HaloNative.hudStop();setTimeout(()=>PAGES.glasses(),300)">Stop HUD</button></div>` : ''}
    <div class="toggle-row" style="margin-top:8px"><div class="toggle-info"><div class="label">Mirror chat replies to the HUD</div><div class="desc">Character replies also appear on connected display glasses.</div></div>
      <label class="tog"><input type="checkbox" data-gk="hudMirror" ${s.hudMirror ? 'checked' : ''}><div class="tog-track"></div><div class="tog-thumb"></div></label></div>`;
  c.insertBefore(card, c.children[1]);
  card.querySelector('[data-gk=hudMirror]').onchange = (e) => DB.saveSettings({ ...DB.settings(), hudMirror: e.target.checked });
  const gv = card.querySelector('#gv'); gv.onchange = () => toast(NATIVE.setVolume(Number(gv.value))); gv.oninput = () => card.querySelector('#gv-v').textContent = gv.value;
  const gb = card.querySelector('#gb'); gb.oninput = () => { card.querySelector('#gb-v').textContent = gb.value + '%'; NATIVE.setBrightness(Number(gb.value) / 100); };
  card.querySelector('#gb-auto').onclick = () => { NATIVE.setBrightness(-1); card.querySelector('#gb-v').textContent = 'system'; };
  const cal = (which) => async () => {
    toast(which === 'nod' ? 'Nod your head now…' : 'Shake your head now…');
    try {
      const r = await nativeAsync('headGesture', 6000);
      if (r.axis === 'none') return toast('No movement detected. Try a bit faster.', 'var(--warn)');
      DB.saveSettings({ ...DB.settings(), [which === 'nod' ? 'nodAxis' : 'shakeAxis']: r.axis });
      toast(`${which} → axis ${r.axis}`); PAGES.glasses();
    } catch (e) { toast(e.message, 'var(--warn)'); }
  };
  card.querySelector('#cal-nod').onclick = cal('nod');
  card.querySelector('#cal-shake').onclick = cal('shake');
  card.querySelector('#yn-test').onclick = async () => toast('Answer: ' + await GTOOLS.askYesNo('Is this working?', 12));
  card.querySelector('#pose').onclick = async () => { try { const p = await nativeAsync('headPose'); toast(`yaw ${p.yawDeg}° · pitch ${p.pitchDeg}° · roll ${p.rollDeg}°`); } catch (e) { toast(e.message, 'var(--warn)'); } };
};

// ────────────────────────────────────────────────────────────────────────────
// BOOT
// ────────────────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item[data-page]').forEach(el => el.setAttribute('tabindex', '0'));
GLASSES.apply();

// Resume any running tasks from before app restart
DB.tasks().filter(t => t.status === 'running').forEach(t => {
  DB.updateTask(t.id, { status: 'pending' }); // mark as pending; user can retry
});

// Check for any waiting_for_approval tasks that need to be surfaced
const pendingApprovals = DB.tasks().filter(t => t.status === 'waiting_for_approval');
if (pendingApprovals.length > 0) {
  setTimeout(() => toast(`${pendingApprovals.length} task(s) need approval`, 'var(--warn)'), 500);
}

navigate('home');
</script>
