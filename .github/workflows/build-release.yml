name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [ccr-ea3a135c-yzo362]

jobs:
  android:
    name: Android APKs (Halo + Halo Glasses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.HALO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.HALO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.HALO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.HALO_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "Signing with the keystore from repository secrets."
            {
              echo "HALO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "HALO_KEY_ALIAS=$KEY_ALIAS"
              echo "HALO_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -v -keystore "$KS" -alias halo -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Halo"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. Signed with a one-off key: future builds will not install as updates over this one."
            {
              echo "HALO_KEYSTORE_PASSWORD=$PW"
              echo "HALO_KEY_ALIAS=halo"
              echo "HALO_KEY_PASSWORD=$PW"
            } >> "$GITHUB_ENV"
          fi
          echo "HALO_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build signed release APKs
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          AS="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/halo-2.2.0.apk
          cp glasses/build/outputs/apk/release/glasses-release.apk ../out/halo-glasses-1.0.0.apk
          for f in ../out/*.apk; do "$AS" verify --print-certs "$f" | head -3; done
          rm -f "$HALO_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: out/*.apk
          retention-days: 90

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage Electron app
        shell: bash
        run: scripts/stage-electron.sh 1.4.0

      - name: Install Electron and build installers
        shell: bash
        working-directory: stage
        run: |
          npm install --save-dev electron@33.2.1 electron-builder@25.1.8 --no-audit --no-fund
          npx electron-builder --win nsis msi --x64 --config electron-builder.json --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
          retention-days: 90

  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage Electron app
        run: scripts/stage-electron.sh 1.4.0

      - name: Install Electron and build Linux packages
        working-directory: stage
        run: |
          npm install --save-dev electron@33.2.1 electron-builder@25.1.8 --no-audit --no-fund
          npx electron-builder --linux AppImage deb --x64 --config electron-builder.json --publish never

      - name: Add local AI setup scripts
        run: cp scripts/linux-local-ai-setup.sh scripts/arkon-local-setup.sh scripts/sillytavern-setup.sh dist-electron/

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/linux-local-ai-setup.sh
            dist-electron/arkon-local-setup.sh
            dist-electron/sillytavern-setup.sh
          retention-days: 90
