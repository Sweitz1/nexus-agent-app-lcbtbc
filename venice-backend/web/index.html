<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venice — Private AI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0c;--surface:#111116;--surface2:#1a1a22;
    --border:#1e1e28;--primary:#00ff9f;--text:#fff;
    --text2:#8888aa;--text3:#555566;--error:#ff4466;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
  .logo{font-size:18px;font-weight:700;color:var(--primary);letter-spacing:-.5px}
  .logo span{color:var(--text2);font-weight:400;font-size:13px;margin-left:8px}
  .header-right{display:flex;align-items:center;gap:12px}
  select,input{background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
  select:focus,input:focus{border-color:var(--primary)}
  #model-select{min-width:200px}

  /* Chat area */
  #chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  #chat::-webkit-scrollbar{width:6px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .msg{max-width:800px;width:100%;margin:0 auto;display:flex;gap:10px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:14px;flex-shrink:0;font-weight:600}
  .avatar.ai{background:var(--primary);color:#000}
  .avatar.user{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
  .bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;font-size:14px;line-height:1.6;max-width:calc(100% - 44px);
    white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:var(--surface2)}
  .bubble code{background:var(--surface2);padding:1px 5px;border-radius:4px;
    font-family:'SF Mono',Monaco,monospace;font-size:13px}
  .bubble pre{background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
  .bubble pre code{background:none;padding:0}
  .thinking{color:var(--text3);font-style:italic;font-size:13px}

  /* System message */
  .system-msg{text-align:center;font-size:12px;color:var(--text3);padding:4px 0}

  /* Input bar */
  #input-bar{padding:12px 20px;background:var(--surface);border-top:1px solid var(--border)}
  .input-row{display:flex;gap:10px;max-width:800px;margin:0 auto;align-items:flex-end}
  #user-input{flex:1;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;
    outline:none;resize:none;max-height:180px;line-height:1.5}
  #user-input:focus{border-color:var(--primary)}
  #user-input::placeholder{color:var(--text3)}
  #send-btn{background:var(--primary);color:#000;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
    white-space:nowrap;flex-shrink:0;height:42px}
  #send-btn:disabled{opacity:.4;cursor:default}
  #send-btn:hover:not(:disabled){filter:brightness(1.1)}

  /* Settings panel */
  #settings-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
    z-index:100;align-items:center;justify-content:center}
  #settings-panel.open{display:flex}
  .settings-box{background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:24px;width:440px;max-width:95vw}
  .settings-box h2{font-size:16px;margin-bottom:16px;color:var(--primary)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
  .field input{width:100%}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600}
  .btn-primary{background:var(--primary);color:#000}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--primary);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .icon-btn{background:none;border:1px solid var(--border);color:var(--text2);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>

<header>
  <div class="logo">Venice <span>Private AI</span></div>
  <div class="header-right">
    <select id="model-select"><option value="">Loading models…</option></select>
    <button class="icon-btn" onclick="clearChat()">Clear</button>
    <button class="icon-btn" onclick="openSettings()">⚙ Settings</button>
  </div>
</header>

<div id="chat">
  <div class="system-msg">Your conversations stay private — no logs, no cloud, no tracking.</div>
</div>

<div id="input-bar">
  <div class="input-row">
    <textarea id="user-input" rows="1" placeholder="Message Venice…"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Settings -->
<div id="settings-panel">
  <div class="settings-box">
    <h2>Venice Settings</h2>
    <div class="field">
      <label>Server URL</label>
      <input id="s-url" type="text" placeholder="https://your-server.com">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="s-key" type="password" placeholder="your-api-key">
    </div>
    <div class="field">
      <label>System Prompt (optional)</label>
      <input id="s-system" type="text" placeholder="You are a helpful assistant…">
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
const LS = {
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k,v) => { try { localStorage.setItem(k, v) } catch {} },
};

let cfg = {
  url: LS.get('venice_url') || window.location.origin,
  key: LS.get('venice_key') || '',
  system: LS.get('venice_system') || '',
};
let history = [];
let streaming = false;

// ── Settings ────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('s-url').value = cfg.url;
  document.getElementById('s-key').value = cfg.key;
  document.getElementById('s-system').value = cfg.system;
  document.getElementById('settings-panel').classList.add('open');
}
function closeSettings() { document.getElementById('settings-panel').classList.remove('open'); }
function saveSettings() {
  cfg.url = document.getElementById('s-url').value.replace(/\/$/, '');
  cfg.key = document.getElementById('s-key').value;
  cfg.system = document.getElementById('s-system').value;
  LS.set('venice_url', cfg.url);
  LS.set('venice_key', cfg.key);
  LS.set('venice_system', cfg.system);
  closeSettings();
  loadModels();
}

// ── Models ──────────────────────────────────────────────────────
async function loadModels() {
  if (!cfg.key) return;
  try {
    const r = await fetch(`${cfg.url}/v1/models`, {
      headers: { Authorization: `Bearer ${cfg.key}` }
    });
    const data = await r.json();
    const sel = document.getElementById('model-select');
    const models = data.data || [];
    sel.innerHTML = models.length
      ? models.map(m => `<option value="${m.id}">${m.id}</option>`).join('')
      : '<option value="">No models — pull one first</option>';
    const saved = LS.get('venice_model');
    if (saved) sel.value = saved;
  } catch (e) {
    console.error('Failed to load models', e);
  }
}
document.getElementById('model-select').addEventListener('change', e => {
  LS.set('venice_model', e.target.value);
});

// ── Chat ────────────────────────────────────────────────────────
function appendMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar ${role === 'user' ? 'user' : 'ai'}">${role === 'user' ? 'You' : 'V'}</div>
    <div class="bubble" id="bubble-${Date.now()}">${escHtml(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector('.bubble');
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatBubble(bubble, text) {
  // basic markdown: code blocks, inline code, bold
  let html = escHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  bubble.innerHTML = html;
}

function clearChat() {
  history = [];
  const chat = document.getElementById('chat');
  chat.innerHTML = '<div class="system-msg">Conversation cleared.</div>';
}

async function sendMessage() {
  if (streaming) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const model = document.getElementById('model-select').value;
  if (!model) { alert('Select a model first'); return; }
  if (!cfg.key) { openSettings(); return; }

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  streaming = true;

  appendMsg('user', text);
  history.push({ role: 'user', content: text });

  const aiBubble = appendMsg('assistant', '');
  aiBubble.innerHTML = '<span class="dot"></span>';

  const messages = [];
  if (cfg.system) messages.push({ role: 'system', content: cfg.system });
  messages.push(...history);

  try {
    const r = await fetch(`${cfg.url}/v1/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${cfg.key}`,
      },
      body: JSON.stringify({ model, messages, stream: true, temperature: 0.8 }),
    });

    if (!r.ok) throw new Error(`HTTP ${r.status}`);

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    aiBubble.innerHTML = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') break;
        try {
          const obj = JSON.parse(data);
          const delta = obj.choices?.[0]?.delta?.content || '';
          full += delta;
          formatBubble(aiBubble, full);
          document.getElementById('chat').scrollTop = 9999;
        } catch {}
      }
    }

    history.push({ role: 'assistant', content: full });
  } catch (e) {
    aiBubble.innerHTML = `<span style="color:var(--error)">Error: ${e.message}</span>`;
  } finally {
    streaming = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// Auto-resize textarea
const ta = document.getElementById('user-input');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Init
if (!cfg.key) openSettings();
else loadModels();
</script>
</body>
</html>
