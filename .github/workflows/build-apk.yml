name: Build Nexus Agent APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    # Pushing a version tag (e.g. v2.6.0) builds signed APKs + Play bundles and publishes a GitHub Release.
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; just make sure platform 34 is present.
      - name: Install Android SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: RayNeo Mercury SDK (optional)
        # The SDK is proprietary, so it is never committed in plain form. Either commit it
        # encrypted (android/libs/rayneo/MercuryAndroidSDK.aar.gpg, passphrase in the
        # RAYNEO_SDK_PASSPHRASE secret) or put a private download link in RAYNEO_SDK_URL.
        env:
          RAYNEO_SDK_PASSPHRASE: ${{ secrets.RAYNEO_SDK_PASSPHRASE }}
          RAYNEO_SDK_URL: ${{ secrets.RAYNEO_SDK_URL }}
        run: |
          OUT=android/libs/rayneo/MercuryAndroidSDK.aar
          if [ -n "$RAYNEO_SDK_PASSPHRASE" ] && [ -f "$OUT.gpg" ]; then
            gpg --batch --quiet --pinentry-mode loopback --passphrase "$RAYNEO_SDK_PASSPHRASE" -o "$OUT" -d "$OUT.gpg"
          elif [ -n "$RAYNEO_SDK_URL" ]; then
            curl -fsSL -o "$OUT" "$RAYNEO_SDK_URL"
          fi
          if [ -f "$OUT" ]; then unzip -tq "$OUT" && echo "RayNeo SDK: included"; else echo "RayNeo SDK: not configured (built-in fallback)"; fi

      - name: Build APKs (and Play bundles for releases)
        working-directory: android
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
          # Tagged releases must be signed with your own key, never the debug key.
          NEXUS_REQUIRE_RELEASE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle --no-daemon assembleDebug assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug assembleRelease
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/nexus-agent.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/nexus-agent-debug.apk
          cp android/glasses/build/outputs/apk/release/glasses-release.apk out/nexus-glasses.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/nexus-agent.aab
            cp android/glasses/build/outputs/bundle/release/glasses-release.aab out/nexus-glasses.aab
          fi
          ls -la out

      - name: Verify signatures
        run: |
          shopt -s nullglob
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          : > out/SIGNING.txt
          for f in out/nexus-agent.apk out/nexus-glasses.apk; do
            echo "== $(basename "$f")" >> out/SIGNING.txt
            "$APKSIGNER" verify --verbose --print-certs "$f" > verify.log   # fails the step if the signature is invalid
            grep -E "Verified using v(2|3) scheme" verify.log >> out/SIGNING.txt || true
            grep -iE "certificate (DN|SHA-256 digest)" verify.log | sort -u >> out/SIGNING.txt || true
          done
          cat out/SIGNING.txt
          if grep -q "CN=Android Debug" out/SIGNING.txt; then
            echo "::warning::Signed with the DEBUG key — add the NEXUS_KEYSTORE_* secrets for real release signing"
          fi
          cd out && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-apk
          path: |
            out/*.apk
            out/*.aab
            out/*.txt
          retention-days: 30

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Nexus Agent $TAG"
            echo
            echo "- **nexus-agent.apk**: the full app, for your phone (as the server) or standalone on the glasses"
            echo "- **nexus-glasses.apk**: the lightweight Nexus Glasses client for RayNeo X3 / X3 Pro"
            echo "- **\*.aab**: Android App Bundles for uploading to Google Play"
            echo "- **SHA256SUMS.txt** / **SIGNING.txt**: checksums and signing certificate"
            echo
            echo '```'
            cat out/SIGNING.txt
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/*.aab out/*.txt --clobber
          else
            gh release create "$TAG" out/*.apk out/*.aab out/*.txt --title "Nexus Agent $TAG" --notes-file notes.md
          fi

      - name: Attach to GitHub release (published manually)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.apk --clobber
