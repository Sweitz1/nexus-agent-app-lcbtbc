plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexusagent.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexusagent.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('NEXUS_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('NEXUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEXUS_KEY_ALIAS')
                keyPassword System.getenv('NEXUS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            if (System.getenv('NEXUS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
