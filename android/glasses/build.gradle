plugins {
    id 'com.android.application'
}

// Nexus Glasses: lightweight client for AR glasses. Talks to the Nexus phone app over Wi-Fi.
android {
    namespace 'com.nexus.glasses'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexus.agent.glasses'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.6.1'
        // RayNeo X3 Pro is arm64; -PnexusAbis=… adds the emulator ABI for the device test.
        ndk { abiFilters(*((project.findProperty('nexusAbis') ?: 'arm64-v8a,armeabi-v7a').toString().split(',').collect { it.trim() })) }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    // 6DoF head tracking: libnexus_xr talks to the glasses' OpenXR runtime (src/main/cpp).
    ndkVersion '26.1.10909125'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { prefab true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Khronos OpenXR loader (Apache-2.0). The runtime comes with the glasses' OS.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.58'
}

apply from: rootProject.file('shared/rayneo.gradle')
apply from: rootProject.file('shared/signing.gradle')
