<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nexus Agent</title>
<style>
:root{
  --bg:#000;--panel:#07090d;--panel2:#0d1117;--line:#1c2430;--text:#e6f7ff;--dim:#8aa0b2;
  --accent:#00e5ff;--accent2:#b388ff;--ok:#39ff88;--warn:#ffcc33;--bad:#ff5577;
  --fs:16px;--radius:10px;
}
body.glasses{--fs:21px;--panel:#000;--panel2:#05080b;--line:#163040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:.45em .8em;cursor:pointer}
button.primary{background:#003b44;border-color:var(--accent);color:var(--accent)}
button.danger{border-color:#5a1a28;color:var(--bad)}
button.small{padding:.2em .55em;font-size:.85em}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.4em .55em;width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.3);margin:0 .5em 0 .2em;accent-color:var(--accent)}
label{display:block;color:var(--dim);font-size:.85em;margin:.5em 0 .15em}
label.inline{display:flex;align-items:center;color:var(--text);font-size:1em;margin:.35em 0}
:focus{outline:none}
:focus-visible,.kbd :focus{outline:3px solid var(--accent)!important;outline-offset:2px;box-shadow:0 0 12px #00e5ff88}
header{display:flex;gap:.3em;padding:.35em .5em;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;align-items:center}
header .brand{color:var(--accent);font-weight:700;margin-right:.4em;white-space:nowrap}
header button{background:transparent;border-color:transparent;white-space:nowrap}
header button.active{color:var(--accent);border-color:var(--accent)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:.6em .7em 2em;display:none}
.view.active{display:block}
#view-chat{display:none;flex-direction:column;padding:0}
#view-chat.active{display:flex}
.chatbar{display:flex;gap:.4em;padding:.4em .6em;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chatbar select{width:auto;max-width:40vw}
#messages{flex:1;overflow-y:auto;padding:.5em .7em}
.msg{margin:.45em 0;padding:.5em .7em;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);white-space:normal;word-wrap:break-word}
.msg.user{border-color:#16384a;background:#03141c;margin-left:12%}
.msg.assistant{margin-right:4%}
.msg.system{color:var(--dim);font-size:.85em;border-style:dashed}
.msg.error{border-color:var(--bad);color:#ffc2cc}
.msg .who{font-size:.78em;color:var(--accent2);margin-bottom:.15em;display:flex;gap:.6em;justify-content:space-between}
.msg .who .t{color:var(--dim)}
.msg pre{background:#000;border:1px solid var(--line);padding:.5em;border-radius:6px;overflow-x:auto;white-space:pre-wrap}
.msg code{background:#0b1a22;padding:0 .25em;border-radius:4px}
.msg a{color:var(--accent)}
.steps{margin-top:.35em;font-size:.8em;color:var(--dim);border-left:2px solid var(--line);padding-left:.5em}
.steps div{white-space:pre-wrap;overflow:hidden;max-height:4.5em}
.composer{display:flex;gap:.4em;padding:.45em .6em;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:2.3em;max-height:8em;flex:1}
.chips{display:flex;gap:.35em;flex-wrap:wrap;padding:0 .6em}
.chips:empty{display:none}
.chip{font-size:.8em;border:1px solid var(--line);border-radius:99px;padding:.1em .5em;display:flex;gap:.3em;align-items:center}
.chip img{height:1.6em;border-radius:3px}
.thumbs{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.3em}
.thumbs img{max-height:7em;max-width:45%;border-radius:6px;border:1px solid var(--line)}
.thumbs span{font-size:.8em;color:var(--dim)}
.filerow{display:flex;gap:.5em;align-items:center;border-bottom:1px solid var(--line);padding:.35em 0;flex-wrap:wrap}
.filerow .fname{flex:1;min-width:10em;word-break:break-all}
.filerow img{width:3em;height:3em;object-fit:cover;border-radius:4px}
#camVideo{width:100%;max-height:60vh;background:#000;border-radius:8px}
#cam,#attach{min-width:2.3em}
#mic{font-size:1.25em;min-width:2.6em;border-color:var(--accent2);color:var(--accent2)}
#mic.on{background:#2a0d4a;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 18px var(--accent2)}}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:.6em .75em;margin:.6em 0}
.card h3{margin:.1em 0 .3em;font-size:1.05em;color:var(--accent);display:flex;justify-content:space-between;gap:.5em;align-items:center}
.row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:9em}
.row>button,.row>.nogrow{flex:none;min-width:0}
.hint{color:var(--dim);font-size:.82em;margin:.3em 0}
.pill{display:inline-block;font-size:.72em;padding:.05em .5em;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-left:.3em}
.pill.risky{color:var(--warn);border-color:#5a4a10}
.pill.local{color:var(--ok);border-color:#155a33}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.2em .8em}
h2{font-size:1.15em;margin:.5em 0;color:var(--text)}
code.block{display:block;white-space:pre-wrap;background:#000;border:1px solid var(--line);padding:.5em;border-radius:6px;font-size:.82em;word-break:break-all}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:1em}
#modal.show{display:flex}
#modal .box{background:var(--panel2);border:1px solid var(--accent);border-radius:var(--radius);padding:1em;max-width:36em;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:4.5em;left:50%;transform:translateX(-50%);background:#002a30;border:1px solid var(--accent);padding:.4em .9em;border-radius:99px;display:none;z-index:11}
.status-dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--dim);margin-right:.3em}
.status-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
body.glasses .msg.user{margin-left:6%}
body.glasses header .brand{display:none}
@media (max-width:520px){.msg.user{margin-left:4%}}
</style>
</head>
<body>
<header id="tabs">
  <span class="brand">⬡ NEXUS</span>
  <button data-tab="chat" class="active">Chat</button>
  <button data-tab="agents">Agents</button>
  <button data-tab="providers">Models</button>
  <button data-tab="files">Files</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="hooks">Webhooks</button>
  <button data-tab="settings">Settings</button>
</header>
<main>
  <section id="view-chat" class="view active">
    <div class="chatbar">
      <select id="modeSel" title="Mode">
        <option value="solo">Solo</option>
        <option value="council">Council</option>
        <option value="chain">Chain</option>
        <option value="translate">Translate</option>
      </select>
      <select id="agentSel" title="Agent"></select>
      <span id="modeInfo" class="hint"></span>
      <span style="flex:1"></span>
      <button id="newChat" class="small">New</button>
    </div>
    <div id="messages"></div>
    <div id="chips" class="chips"></div>
    <div class="composer">
      <button id="mic" title="Voice (touchpad long-press / assistant key)">🎙</button>
      <button id="cam" title="Take a photo for the agent">📷</button>
      <button id="attach" title="Attach files">📎</button>
      <textarea id="input" rows="1" placeholder="Ask your agents…"></textarea>
      <button id="send" class="primary">Send</button>
      <button id="stop" class="danger" style="display:none">Stop</button>
    </div>
  </section>
  <section id="view-agents" class="view"></section>
  <section id="view-providers" class="view"></section>
  <section id="view-files" class="view"></section>
  <section id="view-skills" class="view"></section>
  <section id="view-hooks" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ====================================================================== native bridge */
const N = (window.NexusNative && window.NexusNative.isNative && window.NexusNative.isNative()) ? window.NexusNative : null;
const _cbs = {}; let _cbn = 0;
window.__nexusCb = (id, ok, payload) => {
  const c = _cbs[id]; if (!c) return; delete _cbs[id];
  ok ? c.res(payload) : c.rej(new Error((payload && payload.error) || 'native error'));
};
function nativeAsync(fn, ...args) {
  return new Promise((res, rej) => { const id = 'cb' + (++_cbn); _cbs[id] = { res, rej }; N[fn](id, ...args); });
}
const eventHandlers = {};
window.__nexusEvent = (type, payload) => { (eventHandlers[type] || []).forEach(h => { try { h(payload || {}); } catch (e) { console.error(e); } }); };
function onNative(type, fn) { (eventHandlers[type] = eventHandlers[type] || []).push(fn); }

async function http(method, url, headers = {}, body = null, timeoutMs = 120000) {
  if (N) return nativeAsync('http', JSON.stringify({ method, url, headers, body, timeoutMs }));
  // Browser fallback (desktop preview). Subject to CORS.
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { method, headers, body: body == null || method === 'GET' ? undefined : body, signal: ctl.signal });
    const h = {}; r.headers.forEach((v, k) => h[k] = v);
    return { status: r.status, headers: h, body: await r.text() };
  } finally { clearTimeout(t); }
}

/* ====================================================================== helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clip = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + `… [${s.length - n} more chars]` : s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600); }
function parseJSON(s, fb) { try { return s && typeof s === 'string' ? JSON.parse(s) : (s || fb); } catch { return fb; } }
function randToken() { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }

function md(text) {
  // Minimal, safe markdown: code fences, inline code, bold, italics, links, headings, line breaks.
  const parts = String(text || '').split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { return '<pre>' + esc(p.replace(/^[a-zA-Z0-9_+-]*\n/, '')) + '</pre>'; }
    let h = esc(p);
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/^#{1,6} (.*)$/gm, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2">$2</a>')
      .replace(/\n/g, '<br>');
    return h;
  }).join('');
}
function plain(text) { return String(text || '').replace(/<think>[\s\S]*?<\/think>/g, '').replace(/```[\s\S]*?```/g, ' code block ').replace(/[*_`#>]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').trim(); }
function stripThink(text) { return String(text || '').replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim(); }

/* ====================================================================== state */
const PRESETS = [
  { id: 'venice', name: 'Venice AI (private, uncensored)', type: 'openai', baseUrl: 'https://api.venice.ai/api/v1',
    models: ['venice-uncensored', 'llama-3.3-70b', 'qwen3-235b', 'mistral-31-24b', 'deepseek-r1-671b'],
    extra: '{"venice_parameters":{"include_venice_system_prompt":false}}', keyUrl: 'https://venice.ai/settings/api' },
  { id: 'anthropic', name: 'Anthropic Claude', type: 'anthropic', baseUrl: 'https://api.anthropic.com/v1',
    models: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'], extra: '', keyUrl: 'https://console.anthropic.com/settings/keys' },
  { id: 'xai', name: 'xAI Grok', type: 'openai', baseUrl: 'https://api.x.ai/v1', models: ['grok-4', 'grok-4-fast', 'grok-3-mini'], extra: '', keyUrl: 'https://console.x.ai' },
  { id: 'openai', name: 'OpenAI', type: 'openai', baseUrl: 'https://api.openai.com/v1', models: ['gpt-5', 'gpt-5-mini'], extra: '', keyUrl: 'https://platform.openai.com/api-keys' },
  { id: 'gemini', name: 'Google Gemini', type: 'openai', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai', models: ['gemini-2.5-pro', 'gemini-2.5-flash'], extra: '' },
  { id: 'openrouter', name: 'OpenRouter (many models)', type: 'openai', baseUrl: 'https://openrouter.ai/api/v1', models: ['openrouter/auto'], extra: '' },
  { id: 'groq', name: 'Groq', type: 'openai', baseUrl: 'https://api.groq.com/openai/v1', models: ['llama-3.3-70b-versatile'], extra: '' },
  { id: 'ollama', name: 'Ollama (local, private)', type: 'openai', baseUrl: 'http://192.168.1.50:11434/v1', models: ['llama3.1:8b', 'dolphin3', 'qwen2.5:7b'], extra: '', local: true },
  { id: 'lmstudio', name: 'LM Studio (local, private)', type: 'openai', baseUrl: 'http://192.168.1.50:1234/v1', models: ['local-model'], extra: '', local: true },
  { id: 'llamacpp', name: 'llama.cpp / vLLM server (local)', type: 'openai', baseUrl: 'http://192.168.1.50:8080/v1', models: ['default'], extra: '', local: true },
];

function defaultState() {
  const pick = ids => PRESETS.filter(p => ids.includes(p.id)).map(p => ({ id: p.id, name: p.name, type: p.type, baseUrl: p.baseUrl, models: p.models.slice(), extra: p.extra, local: !!p.local, keyUrl: p.keyUrl || '' }));
  const providers = pick(['venice', 'anthropic', 'xai', 'openai', 'ollama']);
  const A = (name, providerId, model, system, o = {}) => ({ id: uid(), name, providerId, model, system, temperature: 0.7, tools: true, skills: ['*'], council: true, ...o });
  const agents = [
    A('Venice', 'venice', 'venice-uncensored', 'You are Venice, a direct, candid assistant. Answer plainly and completely, without moralizing or unnecessary disclaimers.', { tools: false }),
    A('Claude', 'anthropic', 'claude-sonnet-5-5', 'You are Claude, a thoughtful, precise assistant. Use tools when they help.'),
    A('Grok', 'xai', 'grok-4', 'You are Grok: witty, bold and to the point. Use tools when they help.'),
    A('Local', 'ollama', 'llama3.1:8b', 'You are a private assistant running fully on the user\'s own hardware. Be concise.', { tools: false, council: false }),
    A('Nexus', 'anthropic', 'claude-sonnet-5-5', 'You are Nexus, the orchestrator. Break tasks down, delegate to other agents with ask_agent when another model is a better fit (Venice for unfiltered answers, Grok for real-time/witty takes, Local for private data), use your skills (web, files, code, PDF, OCR, images, video, zip, maps, phone, translation; camera_photo shows you what the user is looking at), then give one clear final answer. You are displayed on AR glasses: keep answers short and scannable.', { council: false }),
  ];
  return {
    v: 1, providers, agents, customSkills: [], disabledSkills: [], webhooks: [], memory: {},
    chat: [], current: agents[0].id, mode: 'solo',
    settings: {
      glasses: /rayneo|ffalcon|tcl/i.test(navigator.userAgent) || false, fontSize: 0, speakReplies: false, ttsRate: 1.0, voiceLang: '',
      autoSendVoice: true, confirmActions: true, maxSteps: 8, keepScreenOn: true, synthesizer: agents[4].id, maxTokens: 2048,
      server: { enabled: false, port: 8787, token: randToken(), defaultAgent: agents[4].id, showInChat: true },
      ...extraSettingDefaults(agents),
    },
  };
}
// Settings used by the pro skills (files, vision, OCR, translation, maps...). Merged into older saves.
function extraSettingDefaults(agents) {
  const claude = agents.find(a => a.name === 'Claude') || agents[0];
  return {
    visionAgent: claude.id, ocrEngine: 'local', ocrLang: 'eng',
    translateEngine: 'agent', translateAgent: '', translateMine: 'English', translateTheirs: 'Spanish', translateSpeak: true,
    libreUrl: 'https://libretranslate.com', imageProvider: 'openai', imageModel: 'gpt-image-1',
    cameraCountdown: 3, mapsApp: 'apple',
  };
}
let S = (() => { const s = parseJSON(localStorage.getItem('nexus_state'), null); return s && s.v === 1 ? s : defaultState(); })();
S.settings = { ...extraSettingDefaults(S.agents), ...S.settings };
S.autoApprove = S.autoApprove || [];
let _saveT; function save() { clearTimeout(_saveT); _saveT = setTimeout(() => { try { localStorage.setItem('nexus_state', JSON.stringify(S)); } catch (e) { toast('Save failed: ' + e.message); } }, 250); }

const getKey = pid => (N ? N.storeGet('key_' + pid) : localStorage.getItem('nexus_key_' + pid)) || '';
const setKey = (pid, v) => { v = (v || '').trim(); if (N) { v ? N.storeSet('key_' + pid, v) : N.storeRemove('key_' + pid); } else { v ? localStorage.setItem('nexus_key_' + pid, v) : localStorage.removeItem('nexus_key_' + pid); } };
const agentById = id => S.agents.find(a => a.id === id);
const agentByName = n => S.agents.find(a => a.name.toLowerCase() === String(n || '').toLowerCase().trim()) || S.agents.find(a => a.id === n);
const providerById = id => S.providers.find(p => p.id === id);

/* ====================================================================== LLM adapters */
class ApiError extends Error { constructor(status, msg, body) { super(msg); this.status = status; this.body = body; } }
async function postJSON(url, headers, body, timeoutMs) {
  const r = await http('POST', url, { 'Content-Type': 'application/json', ...headers }, JSON.stringify(body), timeoutMs || 180000);
  const data = parseJSON(r.body, null);
  if (r.status >= 400 || !data) {
    const m = (data && (data.error && (data.error.message || data.error) || data.message)) || clip(r.body, 300) || ('HTTP ' + r.status);
    throw new ApiError(r.status, `HTTP ${r.status}: ${typeof m === 'string' ? m : JSON.stringify(m)}`, r.body);
  }
  return data;
}
function authHeaders(p, key) {
  if (p.type === 'anthropic') {
    const h = { 'x-api-key': key, 'anthropic-version': '2023-06-01' };
    if (!N) h['anthropic-dangerous-direct-browser-access'] = 'true';
    return h;
  }
  const h = key ? { Authorization: 'Bearer ' + key } : {};
  if (p.baseUrl.includes('openrouter.ai')) { h['HTTP-Referer'] = 'https://nexus-agent.local'; h['X-Title'] = 'Nexus Agent'; }
  return h;
}
const base = p => p.baseUrl.replace(/\/+$/, '');

// Merge consecutive same-role messages; ensure the conversation starts with the user.
function normalize(msgs) {
  const out = [];
  for (const m of msgs) {
    if (!m.content) continue;
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content; else out.push({ role: m.role, content: m.content });
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

const Adapters = {
  openai: {
    start(sys, msgs) { return [{ role: 'system', content: sys }, ...msgs]; },
    async call(p, key, agent, conv, tools) {
      const body = { model: agent.model, messages: conv, temperature: Number(agent.temperature), max_tokens: Number(S.settings.maxTokens) || 2048, ...parseJSON(p.extra, {}) };
      if (tools.length) { body.tools = tools.map(t => ({ type: 'function', function: { name: t.name, description: t.description, parameters: t.parameters } })); body.tool_choice = 'auto'; }
      const d = await postJSON(base(p) + '/chat/completions', authHeaders(p, key), body);
      const m = (d.choices && d.choices[0] && d.choices[0].message) || {};
      let text = typeof m.content === 'string' ? m.content : Array.isArray(m.content) ? m.content.map(c => c.text || '').join('') : '';
      const calls = (m.tool_calls || []).map(c => ({ id: c.id || uid(), name: c.function && c.function.name, args: parseJSON(c.function && c.function.arguments, {}) }));
      return { text, calls, raw: { role: 'assistant', content: m.content || '', tool_calls: m.tool_calls } };
    },
    pushResults(conv, raw, results) {
      conv.push(raw);
      results.forEach(r => conv.push({ role: 'tool', tool_call_id: r.id, name: r.name, content: r.content }));
    },
  },
  anthropic: {
    start(sys, msgs) { return msgs.slice(); },
    async call(p, key, agent, conv, tools, sys) {
      const body = { model: agent.model, system: sys, messages: conv, max_tokens: Number(S.settings.maxTokens) || 2048, temperature: Math.min(1, Number(agent.temperature)), ...parseJSON(p.extra, {}) };
      if (tools.length) body.tools = tools.map(t => ({ name: t.name, description: t.description, input_schema: t.parameters }));
      const d = await postJSON(base(p) + '/messages', authHeaders(p, key), body);
      const blocks = d.content || [];
      return {
        text: blocks.filter(b => b.type === 'text').map(b => b.text).join('\n'),
        calls: blocks.filter(b => b.type === 'tool_use').map(b => ({ id: b.id, name: b.name, args: b.input || {} })),
        raw: { role: 'assistant', content: blocks },
      };
    },
    pushResults(conv, raw, results) {
      conv.push(raw);
      conv.push({ role: 'user', content: results.map(r => ({ type: 'tool_result', tool_use_id: r.id, content: r.content })) });
    },
  },
};

let runToken = 0; // bumps on Stop; in-flight runs check it between steps

/**
 * Runs one agent with its tool loop.
 * history: [{role, content, agent?}] (text only). Returns {text, steps:[{name,args,result}]}.
 */
async function runAgent(agent, userText, { history = [], onStep = () => {}, depth = 0, token = runToken, origin = 'chat', images = [] } = {}) {
  const p = providerById(agent.providerId);
  if (!p) throw new Error(`Agent "${agent.name}" has no provider configured`);
  const key = getKey(p.id);
  if (!key && !p.local && !/localhost|127\.0\.0\.1|192\.168\.|10\.\d|\.local/.test(p.baseUrl)) throw new Error(`No API key for ${p.name}. Add it in Models (or from your phone via the remote console).`);
  const ad = Adapters[p.type] || Adapters.openai;
  // Skill loading: with many skills, agents start with a core set and load groups on demand
  // (keeps requests small and under provider tool limits, e.g. 128 for OpenAI).
  const allowed = agent.tools ? skillsFor(agent, depth) : [];
  const mode = S.settings.skillLoading || 'auto';
  const onDemand = allowed.length > 0 && (mode === 'ondemand' || (mode === 'auto' && allowed.length > 32));
  const loaded = new Set(CORE_SKILL_GROUPS);
  let noTools = false;
  const pickTools = () => noTools ? [] : onDemand ? [...allowed.filter(t => loaded.has(t.group)), loadSkillsTool(allowed, loaded)] : allowed;
  let tools = pickTools();
  const sys = buildSystem(agent, { onDemand, allowed });
  const hist = normalize([...history.map(h => ({ role: h.role, content: h.role === 'assistant' && h.agent && h.agent !== agent.name ? `[${h.agent}]: ${h.content}` : h.content })), { role: 'user', content: userText }]);
  const conv = ad.start(sys, hist);
  if (images.length) {
    // Vision input: attach images to the latest user turn in the provider's format.
    const last = conv[conv.length - 1];
    last.content = p.type === 'anthropic'
      ? [...images.map(i => ({ type: 'image', source: { type: 'base64', media_type: i.mime, data: i.b64 } })), { type: 'text', text: last.content }]
      : [{ type: 'text', text: last.content }, ...images.map(i => ({ type: 'image_url', image_url: { url: `data:${i.mime};base64,${i.b64}` } }))];
  }
  const steps = [];
  let max = Math.max(1, Number(S.settings.maxSteps) || 8);
  for (let i = 0; i <= max; i++) {
    if (token !== runToken) throw new Error('Stopped');
    let r;
    try {
      r = await ad.call(p, key, agent, conv, i === max ? [] : tools, sys);
    } catch (e) {
      // Many local / uncensored models do not support function calling: retry without tools.
      if (tools.length && e instanceof ApiError && e.status >= 400 && e.status < 500 && /tool|function/i.test(e.message + e.body)) {
        noTools = true; tools = []; onStep({ name: 'note', args: {}, result: `${agent.model} rejected tools; continuing without skills` }); i--; continue;
      }
      throw e;
    }
    if (!r.calls.length) return { text: r.text || '(no reply)', steps };
    const results = [];
    for (const c of r.calls) {
      if (token !== runToken) throw new Error('Stopped');
      onStep({ name: c.name, args: c.args, result: '…' });
      let out;
      try {
        if (c.name === 'load_skills') {
          const want = [].concat(c.args.groups || c.args.group || []).map(String);
          const groups = [...new Set(allowed.map(t => t.group))];
          const ok = want.map(w => groups.find(g => g.toLowerCase() === w.toLowerCase())).filter(Boolean);
          ok.forEach(g => loaded.add(g)); tools = pickTools();
          out = ok.length ? `Loaded ${ok.join(', ')}. Now available: ${allowed.filter(t => ok.includes(t.group)).map(t => t.name).join(', ')}` : `Unknown group(s). Groups: ${groups.join(', ')}`;
        } else {
          const def = allowed.find(t => t.name === c.name);
          if (!def) out = `Skill ${c.name} is not available to this agent.`;
          else {
            if (onDemand && !loaded.has(def.group)) { loaded.add(def.group); tools = pickTools(); }
            out = await execSkill(c.name, c.args, { agent, depth, origin, token });
            if (def.group === 'Screen') max = Math.max(max, Number(S.settings.screenMaxSteps) || 40); // UI automation needs many small steps
          }
        }
      } catch (e) { out = 'Error: ' + e.message; }
      out = typeof out === 'string' ? out : JSON.stringify(out);
      out = clip(out, 12000);
      steps.push({ name: c.name, args: c.args, result: out });
      onStep({ name: c.name, args: c.args, result: out, done: true });
      results.push({ id: c.id, name: c.name, content: out });
    }
    ad.pushResults(conv, r.raw, results);
  }
  return { text: '(stopped after max tool steps)', steps };
}

function buildSystem(agent, opts = {}) {
  const now = new Date();
  const parts = [agent.system || 'You are a helpful assistant.'];
  const mem = Object.entries(S.memory || {});
  if (mem.length) parts.push('Long-term memory (user facts/preferences):\n' + mem.slice(-40).map(([k, v]) => `- ${k}: ${v}`).join('\n'));
  const promptSkills = S.customSkills.filter(s => s.kind === 'prompt' && agentHasSkill(agent, s.name) && !S.disabledSkills.includes(s.name));
  promptSkills.forEach(s => parts.push(`Skill "${s.name}": ${s.instructions}`));
  parts.push(`Context: current time ${now.toString()}. Device: ${deviceLabel()}.` + (S.settings.glasses ? ' Output is shown on small AR glasses and may be read aloud: prefer short paragraphs and bullet points.' : ''));
  const others = S.agents.filter(a => a.id !== agent.id).map(a => a.name);
  if (agent.tools && agentHasSkill(agent, 'ask_agent') && others.length) parts.push('Other agents you can consult with ask_agent: ' + others.join(', ') + '.');
  if (opts.onDemand) {
    const byGroup = {};
    opts.allowed.filter(t => !CORE_SKILL_GROUPS.includes(t.group)).forEach(t => (byGroup[t.group] = byGroup[t.group] || []).push(t.name));
    parts.push('More skills are available in groups. Call load_skills with the group name(s) before using them (or call a listed skill directly):\n' + Object.entries(byGroup).map(([g, n]) => `- ${g}: ${n.join(', ')}`).join('\n'));
  }
  return parts.join('\n\n');
}
let _dev = null;
function deviceLabel() { if (!_dev) _dev = N ? parseJSON(N.deviceInfo(), {}) : {}; return _dev.model ? `${_dev.manufacturer} ${_dev.model} (Android ${_dev.release})` : 'web browser'; }

function customSkillDefs() {
  return S.customSkills.filter(s => s.kind === 'http').map(s => ({
    name: s.name, group: 'Custom', risky: !!s.confirm, description: s.description || ('Custom HTTP skill ' + s.name),
    parameters: parseJSON(s.params, obj({})),
    run: async a => {
      const fill = t => String(t || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => a[k] == null ? '' : (typeof a[k] === 'object' ? JSON.stringify(a[k]) : String(a[k])));
      const fillUrl = t => String(t || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => encodeURIComponent(a[k] == null ? '' : String(a[k])));
      const headers = parseJSON(fill(s.headers), {});
      const body = s.body ? fill(s.body) : (s.method === 'GET' ? null : JSON.stringify(a));
      if (body && !Object.keys(headers).some(h => h.toLowerCase() === 'content-type')) headers['Content-Type'] = 'application/json';
      const r = await http(s.method || 'POST', fillUrl(s.url), headers, body, 60000);
      return `HTTP ${r.status}\n` + clip(r.body, 8000);
    },
  }));
}
function allSkills() { return [...BUILTIN_SKILLS, ...customSkillDefs()]; }
const CORE_SKILL_GROUPS = ['Web', 'Utility', 'Memory', 'Agents'];
function loadSkillsTool(allowed, loaded) {
  const groups = [...new Set(allowed.map(t => t.group))].filter(g => !loaded.has(g));
  return { name: 'load_skills', group: 'Core', description: 'Load more skill groups for this task. Not yet loaded: ' + (groups.join(', ') || 'none'), parameters: { type: 'object', properties: { groups: { type: 'array', items: { type: 'string' }, description: 'group names, e.g. ["PDF","Email"]' } }, required: ['groups'] } };
}
function agentHasSkill(agent, name) { return (agent.skills || []).includes('*') || (agent.skills || []).includes(name); }
function skillsFor(agent, depth) {
  return allSkills().filter(s => !S.disabledSkills.includes(s.name) && agentHasSkill(agent, s.name) && !(s.name === 'ask_agent' && depth >= 2));
}
async function execSkill(name, args, ctx) {
  const s = allSkills().find(x => x.name === name);
  if (!s || S.disabledSkills.includes(name)) return `Unknown or disabled skill: ${name}`;
  if (s.risky && S.settings.confirmActions && !S.autoApprove.includes(name)) {
    const ok = await confirmBox(`<b>${esc(ctx.agent.name)}</b> wants to run <b>${esc(name)}</b>` + (ctx.origin === 'webhook' ? ' (from a webhook)' : '') + `<code class="block">${esc(clip(JSON.stringify(args, null, 1), 1200))}</code>`, 60000);
    if (!ok) return 'The user declined this action.';
  }
  return s.run(args || {}, ctx);
}

/* ====================================================================== outgoing webhooks */
async function fireWebhook(w, event, agentName, data) {
  const headers = { 'Content-Type': 'application/json', ...parseJSON(w.headers, {}) };
  const payload = { source: 'nexus-agent', event, agent: agentName, data, ts: new Date().toISOString() };
  return http(w.method || 'POST', w.url, headers, JSON.stringify(payload), 30000);
}
function notifyReplyHooks(agentName, prompt, text, origin) {
  S.webhooks.filter(w => w.onReply).forEach(w => fireWebhook(w, 'reply', agentName, { prompt, text, origin }).catch(e => console.warn('webhook', w.name, e)));
}

/* ====================================================================== voice */
function speak(text) {
  const t = plain(text); if (!t) return;
  if (N) N.speak(t.slice(0, 3900), Number(S.settings.ttsRate) || 1);
  else if (window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = Number(S.settings.ttsRate) || 1; speechSynthesis.speak(u); }
}
function stopSpeaking() { if (N) N.stopSpeaking(); else if (window.speechSynthesis) speechSynthesis.cancel(); }
let listening = false;
async function listen() {
  if (listening) { if (N) N.stopListening(); return; }
  stopSpeaking();
  const mic = $('#mic'); const input = $('#input');
  try {
    let text;
    listening = true; mic.classList.add('on');
    if (N) {
      if (!(await ensurePermission('android.permission.RECORD_AUDIO'))) toast('Microphone permission denied — using system voice input');
      text = (await nativeAsync('listen', S.settings.voiceLang || '')).text;
    } else {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) throw new Error('Voice input not supported in this browser');
      text = await new Promise((res, rej) => { const r = new SR(); r.lang = S.settings.voiceLang || navigator.language; r.onresult = e => res(e.results[0][0].transcript); r.onerror = e => rej(new Error(e.error)); r.onend = () => res(''); r.start(); });
    }
    if (text) { input.value = text; if (S.settings.autoSendVoice) send(); else input.focus(); }
  } catch (e) { toast(e.message); }
  finally { listening = false; mic.classList.remove('on'); }
}
onNative('speech_partial', p => { if (listening) $('#input').value = p.text; });

/* ====================================================================== chat */
let busy = false;
function addMsg(m) { S.chat.push(m); if (S.chat.length > 300) S.chat.splice(0, S.chat.length - 300); save(); renderMessages(); return m; }
function renderMessages() {
  const box = $('#messages');
  if (!S.chat.length) {
    box.innerHTML = `<div class="msg system" tabindex="0">Pick an agent and ask anything. <b>Solo</b> talks to one agent, <b>Council</b> asks every council agent in parallel then merges, <b>Chain</b> passes the answer agent → agent.<br>Voice: tap 🎙 (or the assistant key). Type from your phone: enable the remote console in <b>Webhooks</b>.</div>`;
    return;
  }
  box.innerHTML = S.chat.map((m, i) => {
    const steps = (m.steps || []).map(s => `<div>⚙ ${esc(s.name)}(${esc(clip(JSON.stringify(s.args || {}), 160))}) → ${esc(clip(s.result, 240))}</div>`).join('');
    const think = m.role === 'assistant' ? (String(m.content || '').match(/<think>([\s\S]*?)<\/think>/) || [])[1] : '';
    const body = m.role === 'user' || m.role === 'system' ? esc(m.content).replace(/\n/g, '<br>') : (think ? `<details class="steps"><summary tabindex="0">reasoning</summary>${esc(think.trim()).replace(/\n/g, '<br>')}</details>` : '') + md(stripThink(m.content));
    const att = (m.attachments || []).length ? `<div class="thumbs">${m.attachments.map(a => isImagePath(a) ? `<img src="${esc(wsUrl(a))}" alt="">` : `<span>📄 ${esc(a)}</span>`).join('')}</div>` : '';
    return `<div class="msg ${m.role}${m.error ? ' error' : ''}" tabindex="0" data-i="${i}"><div class="who"><span>${esc(m.role === 'user' ? (m.origin === 'webhook' ? 'Webhook' : 'You') : (m.agent || m.role))}${m.pending ? ' …thinking' : ''}</span><span class="t">${m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span></div>${body}${att}${steps ? `<div class="steps">${steps}</div>` : ''}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
function historyForRun() { return S.chat.filter(m => !m.pending && !m.error && (m.role === 'user' || m.role === 'assistant')).slice(-24); }

async function runWithBubble(agent, prompt, history, origin, token, images = []) {
  const m = addMsg({ role: 'assistant', agent: agent.name, content: '', pending: true, steps: [], ts: Date.now(), origin });
  try {
    const r = await runAgent(agent, prompt, { history, token, origin, images, onStep: s => { if (s.done) { m.steps = m.steps.filter(x => x.result !== '…' || x.name !== s.name); m.steps.push(s); } else m.steps.push(s); renderMessages(); } });
    m.content = r.text; m.steps = r.steps; m.pending = false; save(); renderMessages();
    return r.text;
  } catch (e) {
    m.content = `${agent.name}: ${e.message}`; m.error = true; m.pending = false; save(); renderMessages();
    throw e;
  }
}

/** Core dispatcher used by the chat UI, deep links and incoming webhooks. Returns final text. */
async function dispatch(prompt, { mode = S.mode, agentId = S.current, origin = 'chat', showInChat = true, attachments = [] } = {}) {
  const token = runToken;
  const history = historyForRun();
  const agent = agentById(agentId) || S.agents[0];
  const images = attachments.length ? await loadImagesForModel(attachments.filter(isImagePath)) : [];
  const fullPrompt = attachments.length ? `${prompt}\n\n[Attached workspace files: ${attachments.join(', ')}${images.length ? ' — images are included above' : ''}. Use file/PDF/zip/video/OCR skills on them by path.]` : prompt;
  if (!showInChat) {
    if (mode === 'solo') return { agent: agent.name, text: (await runAgent(agent, fullPrompt, { history: [], token, origin, images })).text };
  }
  addMsg({ role: 'user', content: prompt, ts: Date.now(), origin, attachments });
  let final = '', finalAgent = agent.name;
  if (mode === 'translate') {
    const t = translatorAgent();
    final = await runWithBubble(t, translatePrompt(prompt), [], origin, token); finalAgent = t.name;
    if (S.settings.translateSpeak) speak(final);
    notifyReplyHooks(finalAgent, prompt, final, origin);
    return { agent: finalAgent, text: final };
  }
  prompt = fullPrompt;
  if (mode === 'council') {
    const members = S.agents.filter(a => a.council);
    if (!members.length) throw new Error('No agents are marked "In council" (Agents tab).');
    const answers = await Promise.all(members.map(a => runWithBubble(a, prompt, history, origin, token, images).then(t => ({ a, t })).catch(e => ({ a, t: null, e }))));
    const good = answers.filter(x => x.t);
    const synth = agentById(S.settings.synthesizer);
    if (synth && good.length > 1) {
      const brief = `The user asked: """${prompt}"""\n\nSeveral AI agents answered:\n\n` + good.map(x => `### ${x.a.name}\n${stripThink(x.t)}`).join('\n\n') + `\n\nWrite the single best final answer: merge the strongest points, resolve disagreements (say who was right), drop errors. Be concise.`;
      final = await runWithBubble({ ...synth, name: synth.name + ' ⟡ synthesis', tools: false }, brief, [], origin, token); finalAgent = synth.name;
    } else if (good.length) { final = good[0].t; finalAgent = good[0].a.name; }
    else throw new Error('Every council agent failed.');
  } else if (mode === 'chain') {
    const members = S.agents.filter(a => a.council);
    let carry = '';
    for (const a of members) {
      const p = carry ? `Original request: """${prompt}"""\n\nThe previous agent produced:\n"""${stripThink(carry)}"""\n\nImprove, correct and extend it. Return the complete improved result.` : prompt;
      carry = await runWithBubble(a, p, carry ? [] : history, origin, token, carry ? [] : images); finalAgent = a.name;
    }
    final = carry;
  } else {
    final = await runWithBubble(agent, prompt, history, origin, token, images);
  }
  if (S.settings.speakReplies && !['webhook', 'glasses'].includes(origin)) speak(final);
  notifyReplyHooks(finalAgent, prompt, final, origin);
  return { agent: finalAgent, text: final };
}

async function send() {
  const input = $('#input'); let text = input.value.trim();
  const attachments = pendingAttachments.splice(0); renderChips();
  if ((!text && !attachments.length) || busy) { pendingAttachments.push(...attachments); renderChips(); return; }
  if (!text) text = 'Please look at the attached file(s).';
  input.value = ''; autoGrow();
  setBusy(true);
  try { await dispatch(text, { attachments }); } catch (e) { if (e.message !== 'Stopped' && !S.chat.some(m => m.error && m.content.endsWith(e.message))) addMsg({ role: 'system', content: e.message, error: true, ts: Date.now() }); }
  finally { setBusy(false); }
}
function setBusy(b) { busy = b; $('#send').style.display = b ? 'none' : ''; $('#stop').style.display = b ? '' : 'none'; if (!b && S.settings.glasses) $('#mic').focus(); }
function stopRun() { runToken++; stopSpeaking(); S.chat.forEach(m => { if (m.pending) { m.pending = false; m.content = m.content || '(stopped)'; } }); save(); renderMessages(); setBusy(false); }
function autoGrow() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }

function confirmBox(html, timeoutMs) {
  return new Promise(res => {
    const box = $('#modalBox'); const prev = document.activeElement;
    box.innerHTML = `<div>${html}</div><div class="row" style="margin-top:1em"><button class="primary" id="mOk">Allow</button><button id="mNo">Deny</button></div>`;
    $('#modal').classList.add('show');
    let t; const done = v => { clearTimeout(t); $('#modal').classList.remove('show'); modalClose = null; if (prev && prev.focus) prev.focus(); res(v); };
    modalClose = () => done(false);
    $('#mOk').onclick = () => done(true); $('#mNo').onclick = () => done(false);
    if (timeoutMs) t = setTimeout(() => done(false), timeoutMs);
    $('#mOk').focus();
    if (N) N.vibrate(60);
  });
}

// Two-way bind inputs with data-k="field" (data-t: num|bool|list) to an object.
function bind(container, target, after) {
  $$('[data-k]', container).forEach(el => {
    const k = el.dataset.k, t = el.dataset.t;
    const v = target[k];
    if (t === 'bool') el.checked = !!v; else if (t === 'list') el.value = (v || []).join(', '); else el.value = v == null ? '' : v;
    el.addEventListener('change', () => {
      target[k] = t === 'bool' ? el.checked : t === 'num' ? Number(el.value) : t === 'list' ? el.value.split(',').map(s => s.trim()).filter(Boolean) : el.value;
      save(); after && after(k);
    });
  });
}

/** Handles requests arriving at the native LAN server. */
onNative('webhook', async ev => {
  if (String(ev.path || '').startsWith('/client/')) return; // handled by the glasses-client server (js/server-phone.js)
  const reply = (status, data, type = 'application/json') => N.serverRespond(ev.reqId, status, type, typeof data === 'string' ? data : JSON.stringify(data));
  try {
    const q = Object.fromEntries(new URLSearchParams(ev.query || ''));
    const body = parseJSON(ev.body, null);
    const b = body && typeof body === 'object' ? body : {};
    const path = (ev.path || '/').replace(/\/+$/, '') || '/';
    if (path === '/agents') return reply(200, { agents: S.agents.map(a => ({ name: a.name, model: a.model, provider: a.providerId })), modes: ['solo', 'council', 'chain'], current: (agentById(S.current) || {}).name });
    if (path === '/speak') { speak(b.text || ev.body || q.text || ''); return reply(200, { ok: true }); }
    if (path === '/notify') { addMsg({ role: 'system', content: '🔔 ' + (b.text || b.message || ev.body || q.text || ''), ts: Date.now() }); if (N) N.vibrate(80); return reply(200, { ok: true }); }
    if (path === '/config/keys' && ev.method === 'POST') {
      const done = [];
      const allowed = new Set(secretIds().map(x => x.id));
      Object.entries(b).forEach(([pid, key]) => { if (allowed.has(pid) && typeof key === 'string' && key.trim()) { setKey(pid, key); done.push(pid); } });
      if (currentTab === 'providers') renderProviders();
      toast('Keys updated from phone: ' + (done.join(', ') || 'none'));
      return reply(200, { saved: done, providers: S.providers.map(p => ({ id: p.id, name: p.name, hasKey: !!getKey(p.id) })) });
    }
    if (path === '/config' && ev.method === 'GET') return reply(200, exportConfig());
    if (path === '/config/import' && ev.method === 'POST') {
      const ok = await confirmBox('Import configuration sent from <b>' + esc(ev.remote) + '</b>? This replaces agents, providers, skills and webhooks.', 60000);
      if (!ok) return reply(403, { error: 'declined on device' });
      importConfig(b); return reply(200, { ok: true });
    }
    if (path === '/config/providers' && ev.method === 'GET') return reply(200, { providers: S.providers.map(p => ({ id: p.id, name: p.name, hasKey: !!getKey(p.id), local: p.local })), services: secretIds().filter(x => !providerById(x.id)).map(x => ({ ...x, hasKey: !!getKey(x.id) })) });
    let prompt, agentName = b.agent || q.agent, mode = b.mode || q.mode || 'solo';
    if (path === '/run' || path === '/ask' || path === '/api/run') prompt = b.prompt || b.text || b.message || b.q || q.q || q.prompt || (body ? '' : ev.body);
    else if (path.startsWith('/hook')) prompt = `An incoming webhook "${path.slice(6) || 'default'}" was received${ev.method ? ' (' + ev.method + ')' : ''}. Handle it appropriately (act with your skills if it asks for something), then summarize what you did.\n\nPayload:\n${clip(ev.body || JSON.stringify(q), 8000)}`;
    else return reply(404, { error: 'unknown path', paths: ['/run', '/hook/<name>', '/speak', '/notify', '/agents', '/config/keys'] });
    if (!prompt) return reply(400, { error: 'missing prompt' });
    const agent = agentName ? agentByName(agentName) : agentById(S.settings.server.defaultAgent);
    if (!agent) return reply(404, { error: 'unknown agent', agents: S.agents.map(a => a.name) });
    if (!['solo', 'council', 'chain', 'translate'].includes(mode)) mode = 'solo';
    const r = await dispatch(prompt, { mode, agentId: agent.id, origin: 'webhook', showInChat: S.settings.server.showInChat || mode !== 'solo' });
    if (b.speak) speak(r.text);
    reply(200, { agent: r.agent, reply: stripThink(r.text) });
  } catch (e) { reply(500, { error: e.message }); }
});

/* ====================================================================== UI: settings */
function exportConfig(withKeys) {
  const c = { nexus: 1, providers: S.providers, agents: S.agents, customSkills: S.customSkills, disabledSkills: S.disabledSkills, webhooks: S.webhooks, emailAccounts: S.emailAccounts, caldavAccounts: S.caldavAccounts, autoApprove: S.autoApprove, settings: { ...S.settings, server: { ...S.settings.server, token: undefined } } };
  if (withKeys) c.keys = Object.fromEntries(secretIds().map(x => [x.id, getKey(x.id)]).filter(x => x[1]));
  return c;
}
function importConfig(c) {
  if (!c || c.nexus !== 1) throw new Error('Not a Nexus config');
  ['providers', 'agents', 'customSkills', 'disabledSkills', 'webhooks', 'emailAccounts', 'caldavAccounts', 'autoApprove'].forEach(k => { if (Array.isArray(c[k])) S[k] = c[k]; });
  if (c.settings) { const tok = S.settings.server.token; S.settings = { ...S.settings, ...c.settings, server: { ...S.settings.server, ...(c.settings.server || {}), token: tok } }; }
  if (c.keys) Object.entries(c.keys).forEach(([k, v]) => setKey(k, v));
  if (!agentById(S.current)) S.current = S.agents[0].id;
  save(); applySettings(); showTab(currentTab); toast('Configuration imported');
}
/* Binocular glasses (RayNeo X3 / X3 Pro): both eye panels form one wide screen. Mirror draws the UI
   once per eye; temple mode turns touchpad strokes into navigation. Stored natively (applies on change). */
function displayModeHtml() {
  if (!N || !N.displayMode) return '';
  const d = parseJSON(N.displayMode(), {}); const opt = k => ['auto', 'on', 'off'].map(m => `<option value="${m}"${d[k] === m ? ' selected' : ''}>${m === 'auto' ? 'Auto (detect glasses)' : m === 'on' ? 'On' : 'Off'}</option>`).join('');
  return `<div class="row"><div><label>Binocular mirror (one copy per eye)</label><select id="dmMirror">${opt('mirror')}</select></div>
    <div><label>Temple touchpad gestures</label><select id="dmTemple">${opt('temple')}</select></div></div>
    <p class="hint">Now: mirror ${d.mirrorActive ? 'on' : 'off'} · temple ${d.templeActive ? 'on' : 'off'} · screen ${d.width}×${d.height}. Temple: swipe forward/back = next/previous, swipe up/down = scroll, tap = select, double tap = back, long press = voice.</p>`;
}
function bindDisplayMode(v) {
  for (const [id, key] of [['#dmMirror', 'mirror'], ['#dmTemple', 'temple']]) { const el = $(id, v); if (el) el.onchange = () => N.setDisplayMode(key, el.value); }
}
function renderSettings() {
  const v = $('#view-settings'); const st = S.settings;
  const mem = Object.entries(S.memory);
  v.innerHTML = `<h2>Settings</h2>
    <div class="card"><h3>Display &amp; voice</h3>
      <label class="inline"><input type="checkbox" data-k="glasses" data-t="bool">Glasses mode (RayNeo X3 Pro: bigger text, pure-black UI)</label>
      <div class="row"><div><label>Font size px (0 = auto)</label><input data-k="fontSize" data-t="num" type="number" min="0" max="40"></div>
      <div><label>Voice language (e.g. en-US, empty = system)</label><input data-k="voiceLang"></div>
      <div><label>Speech rate</label><input data-k="ttsRate" data-t="num" type="number" step="0.1" min="0.5" max="2"></div></div>
      <label class="inline"><input type="checkbox" data-k="speakReplies" data-t="bool">Read replies aloud</label>
      <label class="inline"><input type="checkbox" data-k="autoSendVoice" data-t="bool">Send automatically after voice input</label>
      <label class="inline"><input type="checkbox" data-k="keepScreenOn" data-t="bool">Keep display on while the app is open</label>
      ${displayModeHtml()}
    </div>
    <div class="card"><h3>Agent runtime</h3>
      <label class="inline"><input type="checkbox" data-k="confirmActions" data-t="bool">Ask before device / network actions (launch apps, intents, HTTP, webhooks)</label>
      <div class="row"><div><label>Skill loading</label><select data-k="skillLoading"><option value="auto">Auto (on demand when an agent has many skills)</option><option value="ondemand">Always on demand (smallest requests)</option><option value="all">Send all skills every request</option></select></div></div>
      <div class="row"><div><label>Max tool steps per reply</label><input data-k="maxSteps" data-t="num" type="number" min="1" max="30"></div>
      <div><label>Max output tokens</label><input data-k="maxTokens" data-t="num" type="number" min="128" max="64000"></div>
      <div><label>Council synthesizer</label><select data-k="synthesizer"><option value="">(none — show each answer)</option>${S.agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div>
    </div>
    ${renderProSettings()}
    <div class="card"><h3>Memory (${mem.length})</h3>
      ${mem.length ? mem.map(([k, val]) => `<div class="hint"><b>${esc(k)}</b>: ${esc(clip(val, 200))}</div>`).join('') : '<p class="hint">Agents save facts here with memory_save.</p>'}
      <div class="row"><button class="small danger nogrow" id="clearMem">Clear memory</button></div></div>
    <div class="card"><h3>Backup</h3>
      <div class="row"><button class="nogrow" id="exp">Export config</button><button class="nogrow" id="expKeys">Export with keys</button><button class="nogrow" id="imp">Import…</button><button class="danger nogrow" id="reset">Factory reset</button></div>
      <p class="hint">Device: ${esc(deviceLabel())}${N ? ' · native bridge ✓' : ' · browser preview'}</p></div>`;
  bind(v, st, k => { applySettings(); if (k === 'glasses') renderSettings(); });
  bindProSettings(v);
  bindDisplayMode(v);
  $('#clearMem').onclick = async () => { if (await confirmBox('Clear all long-term memory?')) { S.memory = {}; save(); renderSettings(); } };
  const showJSON = c => { const s = JSON.stringify(c, null, 1); if (N) N.shareText(s); else infoBox(`<code class="block">${esc(s)}</code>`); };
  $('#exp').onclick = () => showJSON(exportConfig(false));
  $('#expKeys').onclick = async () => { if (await confirmBox('Export includes your API keys in plain text. Continue?')) showJSON(exportConfig(true)); };
  $('#imp').onclick = () => {
    const box = $('#modalBox');
    box.innerHTML = `<label>Paste config JSON</label><textarea id="impTxt" rows="8"></textarea><div class="row" style="margin-top:.6em"><button class="primary" id="impGo">Import</button><button id="impNo">Cancel</button></div>`;
    $('#modal').classList.add('show'); const close = () => { $('#modal').classList.remove('show'); modalClose = null; }; modalClose = close;
    $('#impNo').onclick = close; $('#impGo').onclick = () => { try { importConfig(JSON.parse($('#impTxt').value)); close(); } catch (e) { toast(e.message); } };
    $('#impTxt').focus();
  };
  $('#reset').onclick = async () => { if (await confirmBox('Erase all agents, chats, settings and keys?')) { S.providers.forEach(p => setKey(p.id, '')); localStorage.removeItem('nexus_state'); location.reload(); } };
}
function applySettings() {
  const st = S.settings;
  document.body.classList.toggle('glasses', !!st.glasses);
  document.documentElement.style.setProperty('--fs', st.fontSize > 0 ? st.fontSize + 'px' : (st.glasses ? '21px' : '16px'));
  if (N) N.keepScreenOn(!!st.keepScreenOn);
}

/* ====================================================================== D-pad / touchpad navigation */
// RayNeo temple touchpad swipes arrive as arrow keys, tap = Enter, double-tap/back = Back.
function focusables() {
  const scope = $('#modal').classList.contains('show') ? $('#modal') : document;
  return $$('button, a[href], input:not([disabled]), select, textarea, summary, [tabindex="0"]', scope)
    .filter(el => el.offsetParent !== null && !el.closest('.view:not(.active)'));
}
document.addEventListener('keydown', e => {
  document.body.classList.add('kbd');
  const a = document.activeElement;
  const isText = a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'submit'].includes(a.type)));
  if (e.key === 'Enter' && a && a.id === 'input' && !e.shiftKey) { e.preventDefault(); send(); return; }
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  if (isText && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (a && a.tagName === 'TEXTAREA' && a.value.includes('\n') && !S.settings.glasses) return;
  // Long chat messages: scroll inside before moving focus on.
  if (a && a.classList.contains('msg') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const box = $('#messages'); const r = a.getBoundingClientRect(), br = box.getBoundingClientRect();
    if (e.key === 'ArrowDown' && r.bottom > br.bottom + 4) { box.scrollBy(0, br.height * 0.6); e.preventDefault(); return; }
    if (e.key === 'ArrowUp' && r.top < br.top - 4) { box.scrollBy(0, -br.height * 0.6); e.preventDefault(); return; }
  }
  const list = focusables(); if (!list.length) return;
  let i = list.indexOf(a);
  const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';
  i = i < 0 ? (fwd ? 0 : list.length - 1) : (i + (fwd ? 1 : -1) + list.length) % list.length;
  e.preventDefault();
  list[i].focus({ preventScroll: true });
  list[i].scrollIntoView({ block: 'nearest' });
});
document.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
onNative('back', () => {
  if (modalClose) return modalClose();
  if (busy) return stopRun();
  if (currentTab !== 'chat') return showTab('chat');
  N && N.exitApp();
});
onNative('hwkey', p => { if (p.key === 'voice') { showTab('chat'); listen(); } if (p.key === 'menu') showTab(currentTab === 'settings' ? 'chat' : 'settings'); });
onNative('share', p => { showTab('chat'); $('#input').value = p.text; autoGrow(); $('#input').focus(); });
onNative('deeplink', p => {
  try {
    const u = new URL(p.url); const q = u.searchParams.get('q') || u.searchParams.get('prompt');
    const ag = u.searchParams.get('agent'); if (ag && agentByName(ag)) { S.current = agentByName(ag).id; S.mode = 'solo'; }
    const m = u.searchParams.get('mode'); if (['solo', 'council', 'chain', 'translate'].includes(m)) S.mode = m;
    showTab('chat'); if (q) { $('#input').value = q; send(); }
  } catch (e) { toast('Bad link'); }
});

/* ====================================================================== boot */
function boot() {
$$('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('#send').onclick = send; $('#stop').onclick = stopRun; $('#mic').onclick = listen;
$('#input').addEventListener('input', autoGrow);
$('#modeSel').onchange = e => { S.mode = e.target.value; save(); renderChatBar(); };
$('#agentSel').onchange = e => { S.current = e.target.value; save(); };
$('#newChat').onclick = () => { S.chat = []; save(); renderMessages(); };
// Migrate chats that were mid-reply when the app closed.
S.chat.forEach(m => { if (m.pending) { m.pending = false; m.content = m.content || '(interrupted)'; } });
applySettings();
applyServer();
showTab('chat');
if (S.settings.glasses) $('#mic').focus();
$('#cam').onclick = () => takePhoto({ attach: true }).catch(e => toast(e.message));
$('#attach').onclick = () => importFiles().then(files => { pendingAttachments.push(...files); renderChips(); }).catch(e => toast(e.message));
window.Nexus = { S, dispatch, runAgent, execSkill, exportConfig, importConfig, allSkills }; // for debugging / tests
}
// Boot after every script (including js/skills-pro.js) has loaded.
document.addEventListener('DOMContentLoaded', boot);
