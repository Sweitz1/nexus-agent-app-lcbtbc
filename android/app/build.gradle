plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexus.agent'
        // RayNeo X3 Pro ships an Android 12-based OS; 26+ keeps phones/tablets working too.
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9.0'
        // Native speech libraries (wake word): ARM covers the RayNeo X3 Pro and practically all phones.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        // Optional release signing from CI secrets; falls back to the debug key so the
        // release APK is always installable via `adb install`.
        release {
            def ks = System.getenv('NEXUS_KEYSTORE_PATH')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('NEXUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEXUS_KEY_ALIAS')
                keyPassword System.getenv('NEXUS_KEY_PASSWORD')
            } else {
                def dbg = signingConfigs.getByName('debug')
                storeFile dbg.storeFile
                storePassword dbg.storePassword
                keyAlias dbg.keyAlias
                keyPassword dbg.keyPassword
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            // JavaMail and its activation jar ship identical license files.
            pickFirsts += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // IMAP/SMTP for the email skills (Android build of JavaMail).
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    // Offline speech recognition for the "Hey Nexus" wake word.
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
